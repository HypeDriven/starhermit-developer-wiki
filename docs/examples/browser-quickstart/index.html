<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Collector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="eyebrow">StarHermit browser quickstart</p>
    <h1>Star Collector</h1>
    <p>Collect stars, one at a time. Choose how to play.</p>
    <section id="entry" aria-label="Choose how to play">
      <button id="account">Sign in with StarHermit</button>
      <button id="guest" class="secondary">Play single player (progress isn't saved)</button>
      <p id="entry-note"></p>
    </section>
    <section id="terms" hidden aria-labelledby="terms-title">
      <h2 id="terms-title">StarHermit terms</h2>
      <p>Read the current terms before continuing with your account.</p>
      <pre id="terms-text" tabindex="0"></pre>
      <button id="accept">Accept and continue</button>
      <button id="decline" class="secondary">Back</button>
    </section>
    <section id="game" hidden aria-label="Star collecting game">
      <p id="mode"></p>
      <p class="score"><output id="points">0</output> <span>stars collected</span></p>
      <button id="collect" aria-label="Collect a star">★</button>
      <p id="sync" role="status" aria-live="polite"></p>
      <button id="retry" class="secondary" hidden>Retry save</button>
      <button id="reload" class="secondary" hidden>Load latest cloud progress</button>
      <button id="menu" class="secondary">Back to start</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="starhermit-sdk.js"></script>
  <script>StarHermit.init({ autoRefresh: false });</script>
  <script type="module" src="app.js"></script>
</body>
</html>
