<svg lang="fr" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">Publier le dossier du jeu distribuable</title><desc id="description">Créez votre source dans un dossier client distribuable. Mettez starhermit.txt à sa racine. Téléchargez le dossier ou le bundle, ou déployez le référentiel GitHub configuré. Les joueurs reçoivent tout ce qui se trouve à côté du manifeste client dans le sous-domaine UUID du jeu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="110.0" y="126.0" font-size="16" fill="#deded8">Projet source</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="110.0" y="148.0" font-size="16" fill="#deded8">Construisez votre jeu</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="126.0" font-size="16" fill="#deded8">Dossier distribuable</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt à la racine</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="126.0" font-size="16" fill="#deded8">Publier/déployer</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">Dossier, bundle, GitHub</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="291.0" font-size="16" fill="#deded8">Jeu hébergé</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;limace&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">CONSTRUCTION CLIENT → JEU PUBLIÉ</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">Envoyez uniquement les fichiers que vous souhaitez que les joueurs reçoivent.</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">Chaque fichier à côté du manifeste client est téléchargé et servi.</text>
</g></svg>
