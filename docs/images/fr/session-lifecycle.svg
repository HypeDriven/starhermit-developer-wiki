<svg lang="fr" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">Le cycle de vie d'une session faisant autorité</title>
  <desc id="description">Une nouvelle session devient active. Les sessions persistantes s'interrompent lorsque personne n'est connecté et reprennent à la reconnexion. Un résultat ou un abandon met fin à une session active. Une action du propriétaire, le départ du dernier membre ou l'expiration de la rétention peuvent mettre fin à une session suspendue.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text x="102" y="130">Actif</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text x="377" y="130">En pause</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text x="652" y="130">Fini</text>
    <g font-size="13"><text x="240" y="74">Aucun joueur connecté</text><text x="240" y="186">Reconnecter et reprendre</text><text x="515" y="61">Le propriétaire se termine / final</text><text x="515" y="79">membre quitte / expiration</text><text x="377" y="228">Résultat du jeu ou abandon</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
