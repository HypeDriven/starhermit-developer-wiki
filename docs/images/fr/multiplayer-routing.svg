<svg lang="fr" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">Deux modèles de transport multijoueurs</title><desc id="description">Dans une lecture avec routage par l'hôte, les invités envoient des entrées via un routage en temps réel à la simulation hôte, et l'hôte renvoie des instantanés. Dans un jeu faisant autorité sur le serveur, une salle démarre une session liée&#160;; les joueurs utilisent le socket de jeux avec un script ou un conteneur. La pièce reste le hall d'entrée.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="455" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M210 95H285" />
<path d="M470 95H545" />
<path d="M550 125H475" />
<path d="M290 125H215" />
<path d="M210 320H285" />
<path d="M470 320H545" />
<path d="M550 350H475" />
<path d="M290 350H215" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="120.0" y="104.0" font-size="16" fill="#deded8">Clients invités</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="120.0" y="126.0" font-size="16" fill="#deded8">Entrées / instantanés</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="380.0" y="104.0" font-size="16" fill="#deded8">Routage en temps réel</text>
<text x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/temps réel</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="104.0" font-size="16" fill="#deded8">Client hôte</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="126.0" font-size="16" fill="#deded8">Exécute une simulation</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="120.0" y="329.0" font-size="16" fill="#deded8">Clients joueurs</text>
<text x="120.0" y="351.0" font-size="16" fill="#deded8">Commandes de jeu</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="329.0" font-size="16" fill="#deded8">Session liée</text>
<text x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/jeux</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="329.0" font-size="16" fill="#deded8">Script/conteneur</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="351.0" font-size="16" fill="#deded8">Valide le gameplay</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">HOST-ROUTED · transports de plate-forme&#160;; l'hôte simule</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">Les entrées vont à l'hôte&#160;; les instantanés reviennent aux invités.</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">SERVEUR-AUTORITATIF · la salle démarre une session séparée</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">La salle gère le hall d'entrée&#160;; gameSessionId identifie le gameplay.</text>
</g></svg>
