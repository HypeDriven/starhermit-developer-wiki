<svg lang="fr" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">Un jeu hébergé reçoit un identifiant étendu</title><desc id="description">Le lanceur fournit un jeton de jeu ou le jeu direct du navigateur se connecte et reçoit un jeton d'accès dans le fragment d'URL. Le jeu supprime le fragment, vérifie les conditions actuelles et utilise ses API adaptées au jeu. Le jeu solo non suivi ignore les API du compte.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="250" x="165.0" y="60.0" font-size="16" fill="#deded8">Lancement depuis StarHermit</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#jeu_jeton</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="250" x="595.0" y="60.0" font-size="16" fill="#deded8">Connexion directe au navigateur</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#access_token</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="185.0" font-size="16" fill="#deded8">Lire le jeton&#160;; supprimer un fragment</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="207.0" font-size="16" fill="#deded8">Vérifier les conditions / consentement actuels</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="317.0" font-size="16" fill="#deded8">API à l'échelle du jeu &amp; prises</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">Accepter explicitement les conditions si nécessaire</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">Le jeu solo non suivi n’utilise aucune API ni socket de compte.</text>
</g></svg>
