<svg lang="fr" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">Choisissez l'autorité de jeu</title><desc id="description">Le jeu sur navigateur uniquement utilise la logique de jeu locale. Le mode multijoueur occasionnel utilise des salles en temps réel routées par l'hôte. Les résultats compétitifs validés ou le multijoueur persistant utilisent un script ou un conteneur faisant autorité.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="59.0" font-size="16" fill="#deded8">Qui valide le gameplay ?</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="207.0" font-size="16" fill="#deded8">Navigateur solo</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="229.0" font-size="16" fill="#deded8">Progrès appartenant au client</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="207.0" font-size="16" fill="#deded8">Multijoueur occasionnel</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="229.0" font-size="16" fill="#deded8">Salles acheminées par l'hôte</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="207.0" font-size="16" fill="#deded8">Classé / persistant</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">Script ou conteneur</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">Jeu local</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">Faites confiance à l'hôte</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">Valider sur le serveur</text>
<text lengthAdjust="spacingAndGlyphs" textLength="736" x="380" y="302" font-size="13" fill="#bfc7c1">La connexion, les paramètres et les sauvegardes dans le cloud ne nécessitent pas de serveur de jeu.</text>
</g></svg>
