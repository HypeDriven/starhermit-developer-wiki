<svg lang="fr" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">À lire avant d'écrire une sauvegarde dans le cloud</title><desc id="description">Une lecture réussie valide les données et conserve l'ETag, ou un 404 prépare les valeurs par défaut. Échec des lectures et écritures du bloc. Utiliser des écritures conditionnelles&#160;; le succès adopte le nouvel ETag, tandis qu'un conflit 412 conserve la progression locale et nécessite un rechargement ou une fusion explicite.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" x="380.0" y="55.0" font-size="16" fill="#deded8">Charger l'emplacement de sauvegarde dans le cloud</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="172.0" font-size="16" fill="#deded8">Données valides ou 404</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="194.0" font-size="16" fill="#deded8">Conserver ETag / valeurs par défaut</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="172.0" font-size="16" fill="#deded8">Lecture échouée/invalide</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="194.0" font-size="16" fill="#deded8">Bloquer tous les téléchargements</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="302.0" font-size="16" fill="#deded8">Écriture conditionnelle</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="324.0" font-size="16" fill="#deded8">Si-correspondance/si-aucune-correspondance</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="302.0" font-size="16" fill="#deded8">Sauvegarde reconnue</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="324.0" font-size="16" fill="#deded8">Conserver le nouvel ETag</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="432.0" font-size="16" fill="#deded8">412 conflit</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="454.0" font-size="16" fill="#deded8">Recharger / fusion explicite</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">Lire le résultat</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">Succès</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">Maintenir le progrès local</text>
<text lengthAdjust="spacingAndGlyphs" textLength="236" x="630" y="278" font-size="13" fill="#bfc7c1">Réessayez la lecture avant de sauvegarder</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">Après une écriture ambiguë, rechargez avant de tenter une autre écriture.</text>
</g></svg>
