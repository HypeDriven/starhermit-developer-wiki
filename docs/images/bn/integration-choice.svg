<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">গেমপ্লে কর্তৃপক্ষ নির্বাচন করুন</title><desc id="description">শুধুমাত্র ব্রাউজার খেলা স্থানীয় খেলা যুক্তি ব্যবহার করে. ক্যাজুয়াল মাল্টিপ্লেয়ার হোস্ট-রুটেড রিয়েলটাইম রুম ব্যবহার করে। বৈধ প্রতিযোগিতামূলক ফলাফল বা অবিরাম মাল্টিপ্লেয়ার একটি প্রামাণিক স্ক্রিপ্ট বা ধারক ব্যবহার করে।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="59.0" font-size="16" fill="#deded8">কে গেমপ্লে যাচাই করে?</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="207.0" font-size="16" fill="#deded8">একক প্লেয়ার ব্রাউজার</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="229.0" font-size="16" fill="#deded8">ক্লায়েন্ট-মালিকানাধীন অগ্রগতি</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="207.0" font-size="16" fill="#deded8">নৈমিত্তিক মাল্টিপ্লেয়ার</text>
<text x="380.0" y="229.0" font-size="16" fill="#deded8">হোস্ট-রুটেড রুম</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="207.0" font-size="16" fill="#deded8">র‍্যাঙ্কড / অবিচল</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">স্ক্রিপ্ট বা ধারক</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">স্থানীয় খেলা</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">হোস্টকে বিশ্বাস করুন</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">সার্ভারে যাচাই করুন</text>
<text x="380" y="302" font-size="13" fill="#bfc7c1">সাইন-ইন, সেটিংস এবং ক্লাউড সেভের জন্য গেমপ্লে সার্ভারের প্রয়োজন নেই।</text>
</g></svg>
