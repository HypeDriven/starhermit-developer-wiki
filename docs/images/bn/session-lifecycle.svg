<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">একটি প্রামাণিক অধিবেশনের জীবনচক্র</title>
  <desc id="description">একটি নতুন অধিবেশন সক্রিয় হয়ে ওঠে. যখন কেউ সংযুক্ত থাকে না তখন ক্রমাগত সেশনগুলি বিরতি দেয় এবং পুনরায় সংযোগ করলে পুনরায় শুরু হয়। একটি ফলাফল বা পরিত্যাগ একটি সক্রিয় অধিবেশন শেষ হয়. একটি মালিকের ক্রিয়া, সদস্যের চূড়ান্ত ছুটি, বা ধরে রাখার মেয়াদ শেষ হলে একটি বিরতি দেওয়া সেশন শেষ হতে পারে৷</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text x="102" y="130">সক্রিয়</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text lengthAdjust="spacingAndGlyphs" textLength="125" x="377" y="130">বিরতি দেওয়া হয়েছে</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text x="652" y="130">সমাপ্ত</text>
    <g font-size="13"><text x="240" y="74">কোনো খেলোয়াড় সংযুক্ত নেই</text><text x="240" y="186">পুনরায় সংযোগ করুন এবং পুনরায় শুরু করুন</text><text x="515" y="61">মালিক শেষ / চূড়ান্ত</text><text x="515" y="79">সদস্যের ছুটি / মেয়াদ শেষ</text><text x="377" y="228">খেলার ফলাফল বা পরিত্যাগ</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
