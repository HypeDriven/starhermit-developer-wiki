<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">দুটি মাল্টিপ্লেয়ার পরিবহন মডেল</title><desc id="description">হোস্ট-রাউটেড প্লেতে, অতিথিরা হোস্ট সিমুলেশনে রিয়েলটাইম রাউটিং এর মাধ্যমে ইনপুট পাঠায় এবং হোস্ট স্ন্যাপশট ফেরত দেয়। সার্ভার-অনুমোদিত খেলায়, একটি রুম একটি আবদ্ধ সেশন শুরু করে; খেলোয়াড়রা একটি স্ক্রিপ্ট বা ধারক সহ গেম সকেট ব্যবহার করে। রুম লবি থেকে যায়.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
