</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="120.0" y="104.0" font-size="16" fill="#deded8">অতিথি ক্লায়েন্ট</text>
<text x="120.0" y="126.0" font-size="16" fill="#deded8">ইনপুট/স্ন্যাপশট</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="380.0" y="104.0" font-size="16" fill="#deded8">রিয়েলটাইম রাউটিং</text>
<text x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/রিয়েলটাইম</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="104.0" font-size="16" fill="#deded8">হোস্ট ক্লায়েন্ট</text>
<text x="640.0" y="126.0" font-size="16" fill="#deded8">সিমুলেশন চালায়</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="120.0" y="329.0" font-size="16" fill="#deded8">প্লেয়ার ক্লায়েন্ট</text>
<text x="120.0" y="351.0" font-size="16" fill="#deded8">গেমপ্লে কমান্ড</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="329.0" font-size="16" fill="#deded8">আবদ্ধ অধিবেশন</text>
<text x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/গেমস</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="329.0" font-size="16" fill="#deded8">স্ক্রিপ্ট / ধারক</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="351.0" font-size="16" fill="#deded8">গেমপ্লে যাচাই করে</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">হোস্ট-রুটেড · প্ল্যাটফর্ম পরিবহন; হোস্ট simulates</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">ইনপুট হোস্টে যায়; স্ন্যাপশট গেস্ট ফিরে.</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">সার্ভার-অথরিটেটিভ · রুম একটি পৃথক সেশন শুরু করে</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">রুম লবি পরিচালনা করে; gameSessionId গেমপ্লে সনাক্ত করে।</text>
