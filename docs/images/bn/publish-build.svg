<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">বিতরণযোগ্য গেম ফোল্ডারটি প্রকাশ করুন</title><desc id="description">একটি বিতরণযোগ্য ক্লায়েন্ট ফোল্ডারে আপনার উত্স তৈরি করুন। এর মূলে starhermit.txt রাখুন। ফোল্ডার বা বান্ডিল আপলোড করুন, অথবা কনফিগার করা GitHub সংগ্রহস্থল স্থাপন করুন। প্লেয়াররা গেম UUID সাবডোমেনে ক্লায়েন্ট ম্যানিফেস্টের পাশে সব কিছু পায়।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="110.0" y="126.0" font-size="16" fill="#deded8">উত্স প্রকল্প</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="110.0" y="148.0" font-size="16" fill="#deded8">আপনার খেলা তৈরি করুন</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="126.0" font-size="16" fill="#deded8">বিতরণযোগ্য ফোল্ডার</text>
<text x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt রুটে</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="650.0" y="126.0" font-size="16" fill="#deded8">প্রকাশ / স্থাপন</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">ফোল্ডার, বান্ডিল, গিটহাব</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="291.0" font-size="16" fill="#deded8">হোস্ট করা খেলা</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;স্লাগ&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">ক্লায়েন্ট বিল্ড → পাবলিশড গেম</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">আপনি প্লেয়াররা যে ফাইলগুলি পেতে চান শুধুমাত্র সেই ফাইলগুলি পাঠান৷</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">ক্লায়েন্ট ম্যানিফেস্টের পাশে প্রতিটি ফাইল আপলোড এবং পরিবেশন করা হয়।</text>
</g></svg>
