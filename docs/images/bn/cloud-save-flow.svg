<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">ক্লাউড সেভ লেখার আগে পড়ুন</title><desc id="description">একটি সফল পঠন ডেটা যাচাই করে এবং ETag রাখে, অথবা একটি 404 ডিফল্ট প্রস্তুত করে। ব্যর্থ রিডস ব্লক লেখা। শর্তসাপেক্ষ লিখন ব্যবহার করুন; সাফল্য নতুন ETag গ্রহণ করে, যখন একটি 412 দ্বন্দ্ব স্থানীয় অগ্রগতি ধরে রাখে এবং পুনরায় লোড বা একটি স্পষ্ট মার্জ প্রয়োজন।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="55.0" font-size="16" fill="#deded8">ক্লাউড-সেভ স্লট লোড করুন</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="172.0" font-size="16" fill="#deded8">বৈধ তথ্য বা 404</text>
<text x="130.0" y="194.0" font-size="16" fill="#deded8">ETag/ডিফল্ট রাখুন</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="172.0" font-size="16" fill="#deded8">ব্যর্থ/অবৈধ পঠিত</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="194.0" font-size="16" fill="#deded8">সমস্ত আপলোড ব্লক করুন</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="302.0" font-size="16" fill="#deded8">শর্তসাপেক্ষ লিখুন</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="324.0" font-size="16" fill="#deded8">If-Match/ If-None-Match</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="302.0" font-size="16" fill="#deded8">স্বীকৃত সংরক্ষণ</text>
<text x="410.0" y="324.0" font-size="16" fill="#deded8">নতুন ETag রাখুন</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="432.0" font-size="16" fill="#deded8">412 সংঘাত</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="454.0" font-size="16" fill="#deded8">পুনরায় লোড / স্পষ্ট মার্জ</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">ফলাফল পড়ুন</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">সফলতা</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">স্থানীয় অগ্রগতি রাখুন</text>
<text lengthAdjust="spacingAndGlyphs" textLength="236" x="630" y="278" font-size="13" fill="#bfc7c1">সংরক্ষণ করার আগে পড়া পুনরায় চেষ্টা করুন</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">একটি অস্পষ্ট লেখার পরে, অন্য লেখার চেষ্টা করার আগে পুনরায় লোড করুন।</text>
</g></svg>
