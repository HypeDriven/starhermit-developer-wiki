<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title description">
<title id="title">ভাষা হল গেমের সেটিংস মেনুর একটি বিভাগ</title>
<desc id="description">সেটিংস নেভিগেশন গ্রাফিক্স, অডিও, নিয়ন্ত্রণ, এবং ভাষা রয়েছে। নির্বাচিত ভাষা বিভাগটি গেমের ভাষা, পতাকা সহ একটি ইংরেজি পছন্দ, স্বয়ংক্রিয় অ্যাকাউন্ট বা সিস্টেমের ভাষা এবং অ্যাকাউন্ট-টু-অ্যাকাউন্টের স্থিতি অফার করে।</desc>
<rect width="760" height="420" rx="12" fill="#282a2b" />
<g font-family="system-ui, sans-serif" fill="#deded8">
<text x="380" y="44" text-anchor="middle" font-size="23">গেম সেটিংস</text>
<rect x="24" y="70" width="190" height="324" rx="10" fill="#202122" />
<g text-anchor="middle" font-size="17">
<text x="119" y="111">গ্রাফিক্স</text><text x="119" y="157">অডিও</text><text x="119" y="203">নিয়ন্ত্রণ করে</text>
<rect x="38" y="222" width="162" height="42" rx="7" fill="#343939" stroke="#a8cfbd" />
<text x="119" y="249" fill="#a8cfbd">ভাষা</text>
</g>
<rect x="240" y="70" width="496" height="324" rx="10" fill="#202122" />
<g text-anchor="middle">
<text x="488" y="113" font-size="22">ভাষা</text>
<text x="488" y="153" font-size="16">খেলার ভাষা</text>
<rect x="272" y="171" width="432" height="54" rx="7" fill="#343939" stroke="#687671" />
<g transform="translate(293 186) scale(.6)">
<path fill="#012169" d="M0 0h60v40H0z" /><path stroke="#fff" stroke-width="9" d="m0 0 60 40m0-40L0 40" />
<path stroke="#c8102e" stroke-width="3" d="m0 0 60 40m0-40L0 40" />
<path stroke="#fff" stroke-width="14" d="M30 0v40M0 20h60" /><path stroke="#c8102e" stroke-width="8" d="M30 0v40M0 20h60" />
</g>
<text x="488" y="205" font-size="17" translate="no">English</text>
<path d="m670 194 7 7 7-7" fill="none" stroke="#a8cfbd" stroke-width="2" />
<text lengthAdjust="spacingAndGlyphs" textLength="476" x="488" y="262" font-size="15" fill="#a9ada9">এছাড়াও স্বয়ংক্রিয় (অ্যাকাউন্ট বা সিস্টেম) অফার করুন</text>
<text x="488" y="299" font-size="15" fill="#a9ada9"><tspan>কার্যকরী ভাষা: </tspan><tspan translate="no">English</tspan></text>
<rect x="272" y="326" width="432" height="42" rx="7" fill="#343939" />
<text x="488" y="353" font-size="15" fill="#a8cfbd"><tspan>অ্যাকাউন্টে সংরক্ষণ করা হয়েছে</tspan><tspan translate="no"> · ui.language</tspan></text>
</g></g>
</svg>
