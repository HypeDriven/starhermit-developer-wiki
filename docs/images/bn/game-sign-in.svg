<svg lang="bn" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">একটি হোস্ট করা গেম একটি স্কোপড শংসাপত্র পায়</title><desc id="description">লঞ্চার একটি গেম টোকেন প্রদান করে, অথবা সরাসরি ব্রাউজার প্লে সাইন ইন করে এবং URL খন্ডে একটি অ্যাক্সেস টোকেন পায়। গেমটি খণ্ডটি সরিয়ে দেয়, বর্তমান শর্তাদি পরীক্ষা করে এবং এর গেম-স্কোপড API ব্যবহার করে। আনট্র্যাকড একক-প্লেয়ার প্লে স্কিপ অ্যাকাউন্ট APIs।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="165.0" y="60.0" font-size="16" fill="#deded8">StarHermit থেকে লঞ্চ</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#গেম_টোকেন</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="250" x="595.0" y="60.0" font-size="16" fill="#deded8">সরাসরি ব্রাউজার সাইন-ইন করুন</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#অ্যাক্সেস_টোকেন</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="185.0" font-size="16" fill="#deded8">টোকেন পড়ুন; টুকরা অপসারণ</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="207.0" font-size="16" fill="#deded8">বর্তমান শর্তাবলী / সম্মতি পরীক্ষা করুন</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="317.0" font-size="16" fill="#deded8">গেম-স্কোপড API &amp; সকেট</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">প্রয়োজনে স্পষ্টভাবে শর্তাবলী গ্রহণ করুন</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">আনট্র্যাকড একক-প্লেয়ার প্লে কোনো অ্যাকাউন্ট API বা সকেট ব্যবহার করে না।</text>
</g></svg>
