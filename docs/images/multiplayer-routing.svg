<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">Two multiplayer transport models</title><desc id="description">In host-routed play, guests send inputs through realtime routing to the host simulation, and the host returns snapshots. In server-authoritative play, a room starts a bound session; players use the games socket with a script or container. The room remains the lobby.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd"/></marker></defs>
<rect width="760" height="455" rx="12" fill="#282a2b"/>
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M210 95H285"/>
<path d="M470 95H545"/>
<path d="M550 125H475"/>
<path d="M290 125H215"/>
<path d="M210 320H285"/>
<path d="M470 320H545"/>
<path d="M550 350H475"/>
<path d="M290 350H215"/>
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671"/>
<text x="120.0" y="104.0" font-size="16" fill="#deded8">Guest clients</text>
<text x="120.0" y="126.0" font-size="16" fill="#deded8">Inputs / snapshots</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="104.0" font-size="16" fill="#deded8">Realtime routing</text>
<text x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/realtime</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671"/>
<text x="640.0" y="104.0" font-size="16" fill="#deded8">Host client</text>
<text x="640.0" y="126.0" font-size="16" fill="#deded8">Runs simulation</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671"/>
<text x="120.0" y="329.0" font-size="16" fill="#deded8">Player clients</text>
<text x="120.0" y="351.0" font-size="16" fill="#deded8">Gameplay commands</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="329.0" font-size="16" fill="#deded8">Bound session</text>
<text x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/games</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671"/>
<text x="640.0" y="329.0" font-size="16" fill="#deded8">Script / container</text>
<text x="640.0" y="351.0" font-size="16" fill="#deded8">Validates gameplay</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">HOST-ROUTED · platform transports; host simulates</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">Inputs go to the host; snapshots return to guests.</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">SERVER-AUTHORITATIVE · room starts a separate session</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">The room handles the lobby; gameSessionId identifies gameplay.</text>
</g></svg>
