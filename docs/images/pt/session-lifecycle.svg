<svg lang="pt" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">O ciclo de vida de uma sessão oficial</title>
  <desc id="description">Uma nova sessão fica ativa. As sessões persistentes são pausadas quando ninguém está conectado e são retomadas na reconexão. Um resultado ou abandono encerra uma sessão ativa. Uma ação do proprietário, a saída final do membro ou a expiração da retenção podem encerrar uma sessão pausada.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text x="102" y="130">Ativo</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text x="377" y="130">Pausado</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text x="652" y="130">Finalizado</text>
    <g font-size="13"><text x="240" y="74">Nenhum jogador conectado</text><text x="240" y="186">Reconecte e retome</text><text x="515" y="61">Proprietário termina/final</text><text x="515" y="79">membro sai/expira</text><text x="377" y="228">Resultado ou abandono do jogo</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
