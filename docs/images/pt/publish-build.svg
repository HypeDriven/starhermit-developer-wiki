<svg lang="pt" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">Publique a pasta distribuível do jogo</title><desc id="description">Construa sua fonte em uma pasta de cliente distribuível. Coloque starhermit.txt em sua raiz. Faça upload da pasta ou pacote ou implante o repositório GitHub configurado. Os jogadores recebem tudo próximo ao manifesto do cliente no subdomínio UUID do jogo.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="110.0" y="126.0" font-size="16" fill="#deded8">Projeto de origem</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="110.0" y="148.0" font-size="16" fill="#deded8">Construa seu jogo</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="126.0" font-size="16" fill="#deded8">Pasta distribuível</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt na raiz</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="126.0" font-size="16" fill="#deded8">Publicar/implantar</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">Pasta, pacote, GitHub</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="291.0" font-size="16" fill="#deded8">Jogo hospedado</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;lesma&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">CONSTRUÇÃO DO CLIENTE → JOGO PUBLICADO</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">Envie apenas os arquivos que você pretende que os jogadores recebam.</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">Cada arquivo ao lado do manifesto do cliente é carregado e servido.</text>
</g></svg>
