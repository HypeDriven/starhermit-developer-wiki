<svg lang="pt" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">Um jogo hospedado recebe uma credencial com escopo definido</title><desc id="description">O iniciador fornece um token de jogo ou o jogo direto do navegador faz login e recebe um token de acesso no fragmento de URL. O jogo remove o fragmento, verifica os termos atuais e usa as APIs do escopo do jogo. O jogo single-player não rastreado ignora as APIs da conta.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="165.0" y="60.0" font-size="16" fill="#deded8">Lançamento do StarHermit</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#game_token</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="595.0" y="60.0" font-size="16" fill="#deded8">Login direto no navegador</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#access_token</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="185.0" font-size="16" fill="#deded8">Ler token; remover fragmento</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="207.0" font-size="16" fill="#deded8">Verifique os termos/consentimento atuais</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="317.0" font-size="16" fill="#deded8">APIs com escopo de jogo &amp; tomadas</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">Aceite explicitamente os termos quando necessário</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">O jogo single-player não rastreado não usa APIs ou soquetes de conta.</text>
</g></svg>
