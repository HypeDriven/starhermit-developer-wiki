<svg lang="pt" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">Leia antes de escrever um salvamento na nuvem</title><desc id="description">Uma leitura bem-sucedida valida os dados e mantém o ETag, ou um 404 prepara os padrões. Falha na leitura das gravações do bloco. Use gravações condicionais; o sucesso adota a nova ETag, enquanto um conflito 412 retém o progresso local e requer recarga ou uma fusão explícita.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" x="380.0" y="55.0" font-size="16" fill="#deded8">Carregar slot para salvar na nuvem</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="172.0" font-size="16" fill="#deded8">Dados válidos ou 404</text>
<text x="130.0" y="194.0" font-size="16" fill="#deded8">Manter ETag/padrões</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="172.0" font-size="16" fill="#deded8">Leitura falhada/inválida</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="194.0" font-size="16" fill="#deded8">Bloquear todos os uploads</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="302.0" font-size="16" fill="#deded8">Gravação condicional</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="324.0" font-size="16" fill="#deded8">Se-correspondência / Se-nenhuma-correspondência</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="302.0" font-size="16" fill="#deded8">Salvamento reconhecido</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="324.0" font-size="16" fill="#deded8">Mantenha a nova ETag</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="432.0" font-size="16" fill="#deded8">412 conflito</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="454.0" font-size="16" fill="#deded8">Recarregar/mesclagem explícita</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">Leia o resultado</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">Sucesso</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">Mantenha o progresso local</text>
<text lengthAdjust="spacingAndGlyphs" textLength="236" x="630" y="278" font-size="13" fill="#bfc7c1">Tente novamente a leitura antes de salvar</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">Após uma gravação ambígua, recarregue antes de tentar outra gravação.</text>
</g></svg>
