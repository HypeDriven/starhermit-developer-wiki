<svg lang="pt" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">Dois modelos de transporte multijogador</title><desc id="description">No jogo roteado pelo host, os convidados enviam entradas por meio de roteamento em tempo real para a simulação do host, e o host retorna instantâneos. No jogo com autoridade de servidor, uma sala inicia uma sessão vinculada; os jogadores usam o soquete de jogos com um script ou contêiner. A sala continua sendo o lobby.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="455" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M210 95H285" />
<path d="M470 95H545" />
<path d="M550 125H475" />
<path d="M290 125H215" />
<path d="M210 320H285" />
<path d="M470 320H545" />
<path d="M550 350H475" />
<path d="M290 350H215" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="120.0" y="104.0" font-size="16" fill="#deded8">Clientes convidados</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="120.0" y="126.0" font-size="16" fill="#deded8">Entradas/instantâneos</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="380.0" y="104.0" font-size="16" fill="#deded8">Roteamento em tempo real</text>
<text x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/tempo real</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="104.0" font-size="16" fill="#deded8">Cliente anfitrião</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="126.0" font-size="16" fill="#deded8">Executa simulação</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="120.0" y="329.0" font-size="16" fill="#deded8">Clientes de jogadores</text>
<text x="120.0" y="351.0" font-size="16" fill="#deded8">Comandos de jogo</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="329.0" font-size="16" fill="#deded8">Sessão vinculada</text>
<text x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/jogos</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="329.0" font-size="16" fill="#deded8">Script/contêiner</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="351.0" font-size="16" fill="#deded8">Valida a jogabilidade</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">HOST-ROUTED · transportes de plataforma; anfitrião simula</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">As entradas vão para o host; instantâneos retornam aos convidados.</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">SERVIDOR-AUTORITATIVO · sala inicia uma sessão separada</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">A sala cuida do lobby; gameSessionId identifica a jogabilidade.</text>
</g></svg>
