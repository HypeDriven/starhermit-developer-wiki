<svg lang="pt" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">Escolha autoridade de jogo</title><desc id="description">O jogo somente no navegador usa lógica de jogo local. O multijogador casual usa salas em tempo real roteadas pelo host. Resultados competitivos validados ou multijogador persistente usam um script ou contêiner oficial.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="59.0" font-size="16" fill="#deded8">Quem valida a jogabilidade?</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="207.0" font-size="16" fill="#deded8">Navegador para um jogador</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="229.0" font-size="16" fill="#deded8">Progresso de propriedade do cliente</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="207.0" font-size="16" fill="#deded8">Multijogador casual</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="229.0" font-size="16" fill="#deded8">Salas roteadas por host</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="630.0" y="207.0" font-size="16" fill="#deded8">Classificado / persistente</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">Script ou contêiner</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">Jogo local</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">Confie no anfitrião</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">Validar no servidor</text>
<text x="380" y="302" font-size="13" fill="#bfc7c1">O login, as configurações e os salvamentos na nuvem não requerem um servidor de jogo.</text>
</g></svg>
