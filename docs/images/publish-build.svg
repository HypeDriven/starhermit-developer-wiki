<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">Publish the distributable game folder</title><desc id="description">Build your source into a distributable client folder. Put starhermit.txt at its root. Upload the folder or bundle, or deploy the configured GitHub repository. Players receive everything next to the client manifest at the game UUID subdomain.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd"/></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b"/>
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270"/>
<path d="M485 131H560"/>
<path d="M650 172V296H490"/>
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671"/>
<text x="110.0" y="126.0" font-size="16" fill="#deded8">Source project</text>
<text x="110.0" y="148.0" font-size="16" fill="#deded8">Build your game</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="126.0" font-size="16" fill="#deded8">Distributable folder</text>
<text x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt at root</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671"/>
<text x="650.0" y="126.0" font-size="16" fill="#deded8">Publish / deploy</text>
<text x="650.0" y="148.0" font-size="16" fill="#deded8">Folder, bundle, GitHub</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="291.0" font-size="16" fill="#deded8">Hosted game</text>
<text x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;slug&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">CLIENT BUILD → PUBLISHED GAME</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">Only ship files you intend players to receive.</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">Every file beside the client manifest is uploaded and served.</text>
