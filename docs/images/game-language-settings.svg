<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title description">
<title id="title">Language is a section in the game's settings menu</title>
<desc id="description">Settings navigation contains Graphics, Audio, Controls, and Language. The selected Language section offers game language, an English choice with a flag, Automatic account or system language, and saved-to-account status.</desc>
<rect width="760" height="420" rx="12" fill="#282a2b"/>
<g font-family="system-ui, sans-serif" fill="#deded8">
<text x="380" y="44" text-anchor="middle" font-size="23">Game settings</text>
<rect x="24" y="70" width="190" height="324" rx="10" fill="#202122"/>
<g text-anchor="middle" font-size="17">
<text x="119" y="111">Graphics</text><text x="119" y="157">Audio</text><text x="119" y="203">Controls</text>
<rect x="38" y="222" width="162" height="42" rx="7" fill="#343939" stroke="#a8cfbd"/>
<text x="119" y="249" fill="#a8cfbd">Language</text>
</g>
<rect x="240" y="70" width="496" height="324" rx="10" fill="#202122"/>
<g text-anchor="middle">
<text x="488" y="113" font-size="22">Language</text>
<text x="488" y="153" font-size="16">Game language</text>
<rect x="272" y="171" width="432" height="54" rx="7" fill="#343939" stroke="#687671"/>
<g transform="translate(293 186) scale(.6)">
<path fill="#012169" d="M0 0h60v40H0z"/><path stroke="#fff" stroke-width="9" d="m0 0 60 40m0-40L0 40"/>
<path stroke="#c8102e" stroke-width="3" d="m0 0 60 40m0-40L0 40"/>
<path stroke="#fff" stroke-width="14" d="M30 0v40M0 20h60"/><path stroke="#c8102e" stroke-width="8" d="M30 0v40M0 20h60"/>
</g>
<text x="488" y="205" font-size="17" translate="no">English</text>
<path d="m670 194 7 7 7-7" fill="none" stroke="#a8cfbd" stroke-width="2"/>
<text x="488" y="262" font-size="15" fill="#a9ada9">Also offer Automatic (account or system)</text>
<text x="488" y="299" font-size="15" fill="#a9ada9"><tspan>Effective language: </tspan><tspan translate="no">English</tspan></text>
<rect x="272" y="326" width="432" height="42" rx="7" fill="#343939"/>
<text x="488" y="353" font-size="15" fill="#a8cfbd"><tspan>Saved to account</tspan><tspan translate="no"> · ui.language</tspan></text>
