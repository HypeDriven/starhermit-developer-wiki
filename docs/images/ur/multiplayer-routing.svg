<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">دو ملٹی پلیئر ٹرانسپورٹ ماڈل</title><desc id="description">میزبان کے ذریعے چلنے والے کھیل میں، مہمان ریئل ٹائم روٹنگ کے ذریعے میزبان سمولیشن کو ان پٹ بھیجتے ہیں، اور میزبان اسنیپ شاٹس واپس کرتا ہے۔ سرور سے مستند کھیل میں، ایک کمرہ ایک پابند سیشن شروع کرتا ہے۔ کھلاڑی گیم ساکٹ کو اسکرپٹ یا کنٹینر کے ساتھ استعمال کرتے ہیں۔ کمرہ لابی رہتا ہے۔</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
