<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="120.0" y="126.0" font-size="16" fill="#deded8">ان پٹ / سنیپ شاٹس</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="104.0" font-size="16" fill="#deded8">ریئل ٹائم روٹنگ</text>
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/realtime</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="640.0" y="104.0" font-size="16" fill="#deded8">میزبان کلائنٹ</text>
<text unicode-bidi="plaintext" direction="rtl" x="640.0" y="126.0" font-size="16" fill="#deded8">نقلی چلاتا ہے۔</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="120.0" y="329.0" font-size="16" fill="#deded8">پلیئر کلائنٹس</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="120.0" y="351.0" font-size="16" fill="#deded8">گیم پلے کے احکامات</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="329.0" font-size="16" fill="#deded8">پابند سیشن</text>
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/گیمز</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="640.0" y="329.0" font-size="16" fill="#deded8">اسکرپٹ / کنٹینر</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="640.0" y="351.0" font-size="16" fill="#deded8">گیم پلے کی توثیق کرتا ہے۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="34" font-size="13" fill="#bfc7c1">HOST-ROUTED · پلیٹ فارم ٹرانسپورٹ؛ میزبان simulates</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="195" font-size="13" fill="#bfc7c1">ان پٹ میزبان کو جاتے ہیں؛ اسنیپ شاٹس مہمانوں کو لوٹتے ہیں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="252" font-size="13" fill="#bfc7c1">سرور-مستحق · کمرہ ایک الگ سیشن شروع کرتا ہے۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="425" font-size="13" fill="#bfc7c1">کمرہ لابی کو سنبھالتا ہے۔ gameSessionId گیم پلے کی شناخت کرتا ہے۔</text>
