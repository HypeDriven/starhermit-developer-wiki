<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">کلاؤڈ سیو لکھنے سے پہلے پڑھیں</title><desc id="description">ایک کامیاب پڑھنا ڈیٹا کی توثیق کرتا ہے اور ETag کو رکھتا ہے، یا 404 ڈیفالٹس تیار کرتا ہے۔ ناکام ریڈز بلاک رائٹ۔ مشروط تحریریں استعمال کریں؛ کامیابی نئے ETag کو اپناتی ہے، جبکہ 412 تنازعہ مقامی پیش رفت کو برقرار رکھتا ہے اور اسے دوبارہ لوڈ یا واضح انضمام کی ضرورت ہوتی ہے۔</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="55.0" font-size="16" fill="#deded8">کلاؤڈ سیو سلاٹ لوڈ کریں۔</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="130.0" y="172.0" font-size="16" fill="#deded8">درست ڈیٹا یا 404</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="130.0" y="194.0" font-size="16" fill="#deded8">ای ٹیگ / ڈیفالٹس رکھیں</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="630.0" y="172.0" font-size="16" fill="#deded8">ناکام / غلط پڑھنا</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="630.0" y="194.0" font-size="16" fill="#deded8">تمام اپ لوڈز کو مسدود کریں۔</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="130.0" y="302.0" font-size="16" fill="#deded8">مشروط تحریر</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="130.0" y="324.0" font-size="16" fill="#deded8">If-Match/ If-None-Match</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="180" unicode-bidi="plaintext" direction="rtl" x="410.0" y="302.0" font-size="16" fill="#deded8">محفوظ کرنے کا اعتراف کیا۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="410.0" y="324.0" font-size="16" fill="#deded8">نیا ای ٹیگ رکھیں</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="410.0" y="432.0" font-size="16" fill="#deded8">412 تنازعہ</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" unicode-bidi="plaintext" direction="rtl" x="410.0" y="454.0" font-size="16" fill="#deded8">دوبارہ لوڈ / واضح انضمام</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="101" font-size="13" fill="#bfc7c1">نتیجہ پڑھیں</text>
<text unicode-bidi="plaintext" direction="rtl" x="270" y="292" font-size="13" fill="#bfc7c1">کامیابی</text>
<text unicode-bidi="plaintext" direction="rtl" x="215" y="420" font-size="13" fill="#bfc7c1">مقامی ترقی کو برقرار رکھیں</text>
<text lengthAdjust="spacingAndGlyphs" textLength="236" unicode-bidi="plaintext" direction="rtl" x="630" y="278" font-size="13" fill="#bfc7c1">محفوظ کرنے سے پہلے دوبارہ پڑھنے کی کوشش کریں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="515" font-size="13" fill="#bfc7c1">مبہم تحریر کے بعد، دوسری تحریر کی کوشش کرنے سے پہلے دوبارہ لوڈ کریں۔</text>
</g></svg>
