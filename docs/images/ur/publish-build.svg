<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">قابل تقسیم گیم فولڈر شائع کریں۔</title><desc id="description">اپنے ماخذ کو قابل تقسیم کلائنٹ فولڈر میں بنائیں۔ starhermit.txt کو اس کی جڑ میں رکھیں۔ فولڈر یا بنڈل اپ لوڈ کریں، یا تشکیل شدہ GitHub ریپوزٹری کو تعینات کریں۔ پلیئرز گیم UUID سب ڈومین پر کلائنٹ مینی فیسٹ کے آگے سب کچھ وصول کرتے ہیں۔</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="110.0" y="126.0" font-size="16" fill="#deded8">ماخذ پروجیکٹ</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" unicode-bidi="plaintext" direction="rtl" x="110.0" y="148.0" font-size="16" fill="#deded8">اپنا کھیل بنائیں</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="126.0" font-size="16" fill="#deded8">قابل تقسیم فولڈر</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt جڑ میں</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" unicode-bidi="plaintext" direction="rtl" x="650.0" y="126.0" font-size="16" fill="#deded8">شائع کرنا / تعینات کرنا</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" unicode-bidi="plaintext" direction="rtl" x="650.0" y="148.0" font-size="16" fill="#deded8">فولڈر، بنڈل، گٹ ہب</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="291.0" font-size="16" fill="#deded8">کھیل کی میزبانی کی۔</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;سلگ&gt;.starhermit.com</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="45" font-size="13" fill="#bfc7c1">کلائنٹ کی تعمیر → شائع شدہ گیم</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="218" font-size="13" fill="#bfc7c1">صرف وہ فائلیں بھیجیں جو آپ کھلاڑیوں کو وصول کرنا چاہتے ہیں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="365" font-size="13" fill="#bfc7c1">کلائنٹ مینی فیسٹ کے ساتھ موجود ہر فائل کو اپ لوڈ اور پیش کیا جاتا ہے۔</text>
</g></svg>
