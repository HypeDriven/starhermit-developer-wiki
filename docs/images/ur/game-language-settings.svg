<text unicode-bidi="plaintext" direction="rtl" x="488" y="262" font-size="15" fill="#a9ada9">خودکار (اکاؤنٹ یا سسٹم) بھی پیش کریں</text>
<text unicode-bidi="plaintext" direction="rtl" x="488" y="299" font-size="15" fill="#a9ada9"><tspan>مؤثر زبان: </tspan><tspan translate="no">English</tspan></text>
<rect x="272" y="326" width="432" height="42" rx="7" fill="#343939" />
<text unicode-bidi="plaintext" direction="rtl" x="488" y="353" font-size="15" fill="#a8cfbd"><tspan>اکاؤنٹ میں محفوظ کر لیا گیا۔</tspan><tspan translate="no"> · ui.language</tspan></text>
</g></g>
