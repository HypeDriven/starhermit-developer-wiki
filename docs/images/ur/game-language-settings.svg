<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title description">
<title id="title">زبان گیم کے سیٹنگ مینو میں ایک سیکشن ہے۔</title>
<desc id="description">ترتیبات نیویگیشن میں گرافکس، آڈیو، کنٹرولز، اور زبان شامل ہیں۔ منتخب کردہ زبان کا سیکشن گیم لینگوئج، جھنڈے کے ساتھ انگریزی انتخاب، خودکار اکاؤنٹ یا سسٹم لینگویج، اور اکاؤنٹ میں محفوظ کردہ اسٹیٹس پیش کرتا ہے۔</desc>
<rect width="760" height="420" rx="12" fill="#282a2b" />
<g font-family="system-ui, sans-serif" fill="#deded8">
<text unicode-bidi="plaintext" direction="rtl" x="380" y="44" text-anchor="middle" font-size="23">گیم کی ترتیبات</text>
<rect x="24" y="70" width="190" height="324" rx="10" fill="#202122" />
<g text-anchor="middle" font-size="17">
<text unicode-bidi="plaintext" direction="rtl" x="119" y="111">گرافکس</text><text unicode-bidi="plaintext" direction="rtl" x="119" y="157">آڈیو</text><text unicode-bidi="plaintext" direction="rtl" x="119" y="203">کنٹرول کرتا ہے۔</text>
<rect x="38" y="222" width="162" height="42" rx="7" fill="#343939" stroke="#a8cfbd" />
<text unicode-bidi="plaintext" direction="rtl" x="119" y="249" fill="#a8cfbd">زبان</text>
</g>
<rect x="240" y="70" width="496" height="324" rx="10" fill="#202122" />
<g text-anchor="middle">
<text unicode-bidi="plaintext" direction="rtl" x="488" y="113" font-size="22">زبان</text>
<text unicode-bidi="plaintext" direction="rtl" x="488" y="153" font-size="16">کھیل کی زبان</text>
<rect x="272" y="171" width="432" height="54" rx="7" fill="#343939" stroke="#687671" />
<g transform="translate(293 186) scale(.6)">
<path fill="#012169" d="M0 0h60v40H0z" /><path stroke="#fff" stroke-width="9" d="m0 0 60 40m0-40L0 40" />
<path stroke="#c8102e" stroke-width="3" d="m0 0 60 40m0-40L0 40" />
<path stroke="#fff" stroke-width="14" d="M30 0v40M0 20h60" /><path stroke="#c8102e" stroke-width="8" d="M30 0v40M0 20h60" />
</g>
