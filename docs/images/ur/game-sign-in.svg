<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">ایک میزبان گیم کو ایک دائرہ کار کی سند حاصل ہوتی ہے۔</title><desc id="description">لانچر گیم ٹوکن فراہم کرتا ہے، یا براہ راست براؤزر پلے سائن ان کرتا ہے اور URL کے ٹکڑے میں ایک رسائی ٹوکن وصول کرتا ہے۔ گیم ٹکڑے کو ہٹاتا ہے، موجودہ شرائط کو چیک کرتا ہے، اور اپنے گیم اسکوپ والے APIs کا استعمال کرتا ہے۔ غیر ٹریک شدہ سنگل پلیئر پلے سکپس اکاؤنٹ APIs۔</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="165.0" y="60.0" font-size="16" fill="#deded8">StarHermit سے لانچ کریں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="165.0" y="82.0" font-size="16" fill="#deded8">#گیم_ٹوکن</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="595.0" y="60.0" font-size="16" fill="#deded8">براہ راست براؤزر سائن ان</text>
<text unicode-bidi="plaintext" direction="rtl" x="595.0" y="82.0" font-size="16" fill="#deded8">#رسائی_ٹوکن</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="185.0" font-size="16" fill="#deded8">ٹوکن پڑھیں؛ ٹکڑا ہٹا دیں</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" unicode-bidi="plaintext" direction="rtl" x="380.0" y="207.0" font-size="16" fill="#deded8">موجودہ شرائط / رضامندی کو چیک کریں۔</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="300" unicode-bidi="plaintext" direction="rtl" x="380.0" y="317.0" font-size="16" fill="#deded8">گیم کے دائرہ کار والے APIs &amp; ساکٹ</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="258" font-size="13" fill="#bfc7c1">جب ضرورت ہو تو واضح طور پر شرائط کو قبول کریں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="382" font-size="13" fill="#bfc7c1">غیر ٹریک شدہ سنگل پلیئر پلے کوئی اکاؤنٹ API یا ساکٹ استعمال نہیں کرتا ہے۔</text>
</g></svg>
