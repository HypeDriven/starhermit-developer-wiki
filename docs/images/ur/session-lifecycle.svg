<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">ایک مستند سیشن کا لائف سائیکل</title>
  <desc id="description">ایک نیا سیشن فعال ہو جاتا ہے۔ جب کوئی بھی منسلک نہیں ہوتا ہے تو مستقل سیشن رک جاتے ہیں اور دوبارہ منسلک ہونے پر دوبارہ شروع ہو جاتے ہیں۔ نتیجہ یا ترک کرنا ایک فعال سیشن کو ختم کرتا ہے۔ مالک کی کارروائی، رکن کی حتمی چھٹی، یا برقرار رکھنے کی میعاد رکے ہوئے سیشن کو ختم کر سکتی ہے۔</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text unicode-bidi="plaintext" direction="rtl" x="102" y="130">فعال</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text unicode-bidi="plaintext" direction="rtl" x="377" y="130">روک دیا گیا</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text unicode-bidi="plaintext" direction="rtl" x="652" y="130">ختم</text>
    <g font-size="13"><text unicode-bidi="plaintext" direction="rtl" x="240" y="74">کوئی کھلاڑی منسلک نہیں ہے۔</text><text unicode-bidi="plaintext" direction="rtl" x="240" y="186">دوبارہ جڑیں اور دوبارہ شروع کریں۔</text><text unicode-bidi="plaintext" direction="rtl" x="515" y="61">مالک ختم / حتمی</text><text unicode-bidi="plaintext" direction="rtl" x="515" y="79">رکن کی چھٹی / میعاد ختم</text><text unicode-bidi="plaintext" direction="rtl" x="377" y="228">کھیل کا نتیجہ یا ترک کرنا</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
