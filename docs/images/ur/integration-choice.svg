<svg lang="ur" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">گیم پلے اتھارٹی کا انتخاب کریں۔</title><desc id="description">صرف براؤزر پلے مقامی گیم منطق کا استعمال کرتا ہے۔ آرام دہ اور پرسکون ملٹی پلیئر میزبان روٹ والے ریئل ٹائم کمرے استعمال کرتا ہے۔ تصدیق شدہ مسابقتی نتائج یا مستقل ملٹی پلیئر ایک مستند اسکرپٹ یا کنٹینر استعمال کرتے ہیں۔</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" unicode-bidi="plaintext" direction="rtl" x="380.0" y="59.0" font-size="16" fill="#deded8">گیم پلے کی توثیق کون کرتا ہے؟</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="130.0" y="207.0" font-size="16" fill="#deded8">سنگل پلیئر براؤزر</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" unicode-bidi="plaintext" direction="rtl" x="130.0" y="229.0" font-size="16" fill="#deded8">کلائنٹ کی ملکیت میں پیش رفت</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" unicode-bidi="plaintext" direction="rtl" x="380.0" y="207.0" font-size="16" fill="#deded8">آرام دہ اور پرسکون ملٹی پلیئر</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" unicode-bidi="plaintext" direction="rtl" x="380.0" y="229.0" font-size="16" fill="#deded8">میزبان راستے والے کمرے</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="630.0" y="207.0" font-size="16" fill="#deded8">درجہ بندی / مستقل</text>
<text unicode-bidi="plaintext" direction="rtl" x="630.0" y="229.0" font-size="16" fill="#deded8">اسکرپٹ یا کنٹینر</text>
<text unicode-bidi="plaintext" direction="rtl" x="130" y="143" font-size="13" fill="#bfc7c1">مقامی کھیل</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="143" font-size="13" fill="#bfc7c1">میزبان پر بھروسہ کریں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="630" y="143" font-size="13" fill="#bfc7c1">سرور پر توثیق کریں۔</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="302" font-size="13" fill="#bfc7c1">سائن ان، ترتیبات، اور کلاؤڈ سیو کے لیے گیم پلے سرور کی ضرورت نہیں ہے۔</text>
</g></svg>
