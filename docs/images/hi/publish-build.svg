<svg lang="hi" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">वितरणयोग्य गेम फ़ोल्डर प्रकाशित करें</title><desc id="description">अपने स्रोत को एक वितरणयोग्य क्लाइंट फ़ोल्डर में बनाएँ। इसके मूल में Starhermit.txt लगाएं। फ़ोल्डर या बंडल अपलोड करें, या कॉन्फ़िगर किए गए GitHub रिपॉजिटरी को तैनात करें। खिलाड़ियों को गेम यूयूआईडी उपडोमेन पर क्लाइंट मेनिफेस्ट के आगे सब कुछ प्राप्त होता है।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="110.0" y="126.0" font-size="16" fill="#deded8">स्रोत परियोजना</text>
<text x="110.0" y="148.0" font-size="16" fill="#deded8">अपना गेम बनाएं</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="126.0" font-size="16" fill="#deded8">वितरणयोग्य फ़ोल्डर</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="148.0" font-size="16" fill="#deded8">जड़ पर Starhermit.txt</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="126.0" font-size="16" fill="#deded8">प्रकाशित/तैनाती करें</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">फ़ोल्डर, बंडल, GitHub</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="291.0" font-size="16" fill="#deded8">आयोजित खेल</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;काउंटर&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">ग्राहक निर्माण → प्रकाशित गेम</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">केवल वे फ़ाइलें शिप करें जिन्हें आप खिलाड़ियों को प्राप्त करना चाहते हैं।</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">क्लाइंट मेनिफेस्ट के बगल में प्रत्येक फ़ाइल अपलोड और प्रस्तुत की जाती है।</text>
</g></svg>
