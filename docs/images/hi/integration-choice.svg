<svg lang="hi" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">गेमप्ले अथॉरिटी चुनें</title><desc id="description">केवल-ब्राउज़र प्ले स्थानीय गेम लॉजिक का उपयोग करता है। कैज़ुअल मल्टीप्लेयर होस्ट-रूटेड रियलटाइम रूम का उपयोग करता है। मान्य प्रतिस्पर्धी परिणाम या लगातार मल्टीप्लेयर एक आधिकारिक स्क्रिप्ट या कंटेनर का उपयोग करते हैं।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" x="380.0" y="59.0" font-size="16" fill="#deded8">गेमप्ले को कौन मान्य करता है?</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="207.0" font-size="16" fill="#deded8">एकल-खिलाड़ी ब्राउज़र</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="229.0" font-size="16" fill="#deded8">ग्राहक-स्वामित्व वाली प्रगति</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="207.0" font-size="16" fill="#deded8">कैज़ुअल मल्टीप्लेयर</text>
<text x="380.0" y="229.0" font-size="16" fill="#deded8">मेज़बान-मार्गित कमरे</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="207.0" font-size="16" fill="#deded8">रैंक/निरंतर</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">स्क्रिप्ट या कंटेनर</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">स्थानीय नाटक</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">मेज़बान पर भरोसा रखें</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">सर्वर पर सत्यापित करें</text>
<text x="380" y="302" font-size="13" fill="#bfc7c1">साइन-इन, सेटिंग्स और क्लाउड सेव के लिए गेमप्ले सर्वर की आवश्यकता नहीं होती है।</text>
</g></svg>
