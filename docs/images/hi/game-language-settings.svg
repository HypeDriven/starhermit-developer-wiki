<svg lang="hi" xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title description">
<title id="title">भाषा खेल के सेटिंग मेनू में एक अनुभाग है</title>
<desc id="description">सेटिंग्स नेविगेशन में ग्राफ़िक्स, ऑडियो, नियंत्रण और भाषा शामिल हैं। चयनित भाषा अनुभाग खेल की भाषा, ध्वज के साथ एक अंग्रेजी विकल्प, स्वचालित सिस्टम-भाषा का पता लगाने और खाते में सहेजी गई स्थिति प्रदान करता है।</desc>
<rect width="760" height="420" rx="12" fill="#282a2b" />
<g font-family="system-ui, sans-serif" fill="#deded8">
