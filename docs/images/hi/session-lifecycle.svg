<svg lang="hi" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">एक आधिकारिक सत्र का जीवनचक्र</title>
  <desc id="description">एक नया सत्र सक्रिय हो जाता है. लगातार सत्र तब रुकते हैं जब कोई भी कनेक्ट नहीं होता है और पुनः कनेक्ट होने पर फिर से शुरू होता है। परिणाम या परित्याग से सक्रिय सत्र समाप्त हो जाता है। मालिक की कार्रवाई, अंतिम सदस्य की छुट्टी, या प्रतिधारण समाप्ति एक रुके हुए सत्र को समाप्त कर सकती है।</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text x="102" y="130">सक्रिय</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text x="377" y="130">रुका हुआ</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text x="652" y="130">खत्म</text>
    <g font-size="13"><text x="240" y="74">कोई खिलाड़ी कनेक्ट नहीं है</text><text x="240" y="186">पुनः कनेक्ट करें और फिर से शुरू करें</text><text x="515" y="61">स्वामी समाप्त/अंतिम</text><text x="515" y="79">सदस्य छोड़ता/समाप्ति</text><text x="377" y="228">खेल का परिणाम या परित्याग</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
