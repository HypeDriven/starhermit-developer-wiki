<svg lang="hi" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">होस्ट किए गए गेम को एक स्कोप्ड क्रेडेंशियल प्राप्त होता है</title><desc id="description">लॉन्चर एक गेम टोकन प्रदान करता है, या सीधे ब्राउज़र प्ले साइन इन करता है और यूआरएल खंड में एक एक्सेस टोकन प्राप्त करता है। गेम खंड को हटाता है, वर्तमान शर्तों की जांच करता है, और अपने गेम-स्कोप्ड एपीआई का उपयोग करता है। ट्रैक न किया गया एकल-खिलाड़ी खेल खाता API को छोड़ देता है।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="165.0" y="60.0" font-size="16" fill="#deded8">स्टारहर्मिट से लॉन्च करें</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#गेम_टोकन</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="595.0" y="60.0" font-size="16" fill="#deded8">प्रत्यक्ष ब्राउज़र साइन-इन</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#एक्सेस टोकन</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="185.0" font-size="16" fill="#deded8">टोकन पढ़ें; टुकड़ा हटाओ</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="207.0" font-size="16" fill="#deded8">वर्तमान शर्तों/सहमति की जाँच करें</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="317.0" font-size="16" fill="#deded8">गेम-स्कोप्ड एपीआई &amp; कुर्सियां</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">आवश्यकता पड़ने पर शर्तों को स्पष्ट रूप से स्वीकार करें</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">ट्रैक न किया गया एकल-खिलाड़ी खेल किसी खाता एपीआई या सॉकेट का उपयोग नहीं करता है।</text>
</g></svg>
