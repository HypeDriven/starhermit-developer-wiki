<svg lang="hi" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">दो मल्टीप्लेयर ट्रांसपोर्ट मॉडल</title><desc id="description">होस्ट-रूटेड प्ले में, मेहमान रियलटाइम रूटिंग के माध्यम से होस्ट सिमुलेशन में इनपुट भेजते हैं, और होस्ट स्नैपशॉट लौटाता है। सर्वर-आधिकारिक खेल में, एक कमरा एक बाध्य सत्र शुरू करता है; खिलाड़ी स्क्रिप्ट या कंटेनर के साथ गेम सॉकेट का उपयोग करते हैं। कमरा लॉबी बना हुआ है।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="455" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M210 95H285" />
<path d="M470 95H545" />
<path d="M550 125H475" />
<path d="M290 125H215" />
<path d="M210 320H285" />
<path d="M470 320H545" />
<path d="M550 350H475" />
<path d="M290 350H215" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="120.0" y="104.0" font-size="16" fill="#deded8">अतिथि ग्राहक</text>
<text x="120.0" y="126.0" font-size="16" fill="#deded8">इनपुट/स्नैपशॉट</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="104.0" font-size="16" fill="#deded8">रीयलटाइम रूटिंग</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/वास्तविक समय</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="104.0" font-size="16" fill="#deded8">मेज़बान ग्राहक</text>
<text x="640.0" y="126.0" font-size="16" fill="#deded8">अनुकरण चलाता है</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="120.0" y="329.0" font-size="16" fill="#deded8">खिलाड़ी ग्राहक</text>
<text x="120.0" y="351.0" font-size="16" fill="#deded8">गेमप्ले कमांड</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="329.0" font-size="16" fill="#deded8">बाध्य सत्र</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="380.0" y="351.0" font-size="16" fill="#deded8">डब्ल्यूएस/वी1/गेम्स</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="329.0" font-size="16" fill="#deded8">स्क्रिप्ट/कंटेनर</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="351.0" font-size="16" fill="#deded8">गेमप्ले को मान्य करता है</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">होस्ट-रूटेड · प्लेटफ़ॉर्म परिवहन; होस्ट अनुकरण करता है</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">इनपुट होस्ट को जाते हैं; मेहमानों के लिए स्नैपशॉट लौटाए जाते हैं।</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">सर्वर-आधिकारिक · कक्ष एक अलग सत्र शुरू करता है</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">कमरा लॉबी को संभालता है; GameSessionId गेमप्ले की पहचान करता है।</text>
</g></svg>
