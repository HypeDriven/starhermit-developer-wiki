<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">权威会话的生命周期</title>
  <desc id="description">新会话变为活动状态。当没有人连接时，持久会话会暂停，并在重新连接时恢复。结果或放弃结束活动会话。所有者操作、最终成员离开或保留到期都可以结束暂停的会话。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text x="102" y="130">积极的</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text x="377" y="130">已暂停</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text x="652" y="130">完成的</text>
    <g font-size="13"><text x="240" y="74">没有玩家连接</text><text x="240" y="186">重新连接并恢复</text><text x="515" y="61">业主结束/最终</text><text x="515" y="79">会员离开/到期</text><text x="377" y="228">游戏结果或放弃</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
