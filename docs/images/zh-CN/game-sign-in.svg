<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">托管游戏收到范围凭证</title><desc id="description">启动器提供游戏令牌，或直接浏览器玩登录并接收 URL 片段中的访问令牌。游戏删除片段，检查当前条款，并使用其游戏范围的 API。未跟踪的单人游戏会跳过帐户 API。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="165.0" y="60.0" font-size="16" fill="#deded8">从 StarHermit 发射</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#游戏令牌</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="595.0" y="60.0" font-size="16" fill="#deded8">直接浏览器登录</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#访问令牌</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="185.0" font-size="16" fill="#deded8">读取令牌；删除片段</text>
<text x="380.0" y="207.0" font-size="16" fill="#deded8">检查当前条款/同意</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="317.0" font-size="16" fill="#deded8">游戏范围的 API &amp; 插座</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">需要时明确接受条款</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">未跟踪的单人游戏不使用帐户 API 或套接字。</text>
</g></svg>
