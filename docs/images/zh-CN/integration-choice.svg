<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">选择游戏权限</title><desc id="description">仅浏览器游戏使用本地游戏逻辑。休闲多人游戏使用主机路由的实时房间。经过验证的竞争结果或持久的多人游戏使用权威的脚本或容器。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="59.0" font-size="16" fill="#deded8">谁验证游戏玩法？</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="207.0" font-size="16" fill="#deded8">单人浏览器</text>
<text x="130.0" y="229.0" font-size="16" fill="#deded8">客户拥有的进度</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="207.0" font-size="16" fill="#deded8">休闲多人游戏</text>
<text x="380.0" y="229.0" font-size="16" fill="#deded8">主机路由的房间</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="207.0" font-size="16" fill="#deded8">排名/持久</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">脚本或容器</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">本地游玩</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">相信主机</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">在服务器上验证</text>
<text x="380" y="302" font-size="13" fill="#bfc7c1">登录、设置和云保存不需要游戏服务器。</text>
</g></svg>
