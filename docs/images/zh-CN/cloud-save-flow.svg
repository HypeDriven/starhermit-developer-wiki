<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">写入云保存之前请先阅读</title><desc id="description">成功读取会验证数据并保留 ETag，否则 404 会准备默认值。读取块写入失败。使用条件写入；成功采用新的 ETag，而 412 冲突则保留本地进度并需要重新加载或显式合并。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="55.0" font-size="16" fill="#deded8">加载云存储槽</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="172.0" font-size="16" fill="#deded8">有效数据或404</text>
<text x="130.0" y="194.0" font-size="16" fill="#deded8">保留 ETag/默认值</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="172.0" font-size="16" fill="#deded8">读取失败/无效</text>
<text x="630.0" y="194.0" font-size="16" fill="#deded8">阻止所有上传</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="302.0" font-size="16" fill="#deded8">条件写入</text>
<text x="130.0" y="324.0" font-size="16" fill="#deded8">如果匹配/如果不匹配</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="302.0" font-size="16" fill="#deded8">确认保存</text>
<text x="410.0" y="324.0" font-size="16" fill="#deded8">保留新的 ETag</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="432.0" font-size="16" fill="#deded8">第412章 冲突</text>
<text x="410.0" y="454.0" font-size="16" fill="#deded8">重新加载/显式合并</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">阅读结果</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">成功</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">保持局部进展</text>
<text x="630" y="278" font-size="13" fill="#bfc7c1">保存前重试读取</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">在一次不明确的写入之后，在尝试另一次写入之前重新加载。</text>
</g></svg>
