<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">发布可分发的游戏文件夹</title><desc id="description">将您的源代码构建到可分发的客户端文件夹中。将 starhermit.txt 放在其根目录下。上传文件夹或捆绑包，或部署配置的 GitHub 存储库。玩家将收到游戏 UUID 子域中客户端清单旁边的所有内容。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="110.0" y="126.0" font-size="16" fill="#deded8">源项目</text>
<text x="110.0" y="148.0" font-size="16" fill="#deded8">构建你的游戏</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="126.0" font-size="16" fill="#deded8">可分发文件夹</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="148.0" font-size="16" fill="#deded8">根目录下的 starhermit.txt</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="650.0" y="126.0" font-size="16" fill="#deded8">发布/部署</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">文件夹、捆绑包、GitHub</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="291.0" font-size="16" fill="#deded8">主持比赛</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;蛞蝓&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">客户端构建 → 发布游戏</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">仅发送您希望玩家接收的文件。</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">客户端清单旁边的每个文件都会被上传和提供。</text>
