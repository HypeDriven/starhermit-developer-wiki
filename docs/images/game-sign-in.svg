<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">A hosted game receives a scoped credential</title><desc id="description">The launcher provides a game token, or direct browser play signs in and receives an access token in the URL fragment. The game removes the fragment, checks current terms, and uses its game-scoped APIs. Untracked single-player play skips account APIs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd"/></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b"/>
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150"/>
<path d="M595 100V130H380"/>
<path d="M380 225V275"/>
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671"/>
<text x="165.0" y="60.0" font-size="16" fill="#deded8">Launch from StarHermit</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#game_token</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671"/>
<text x="595.0" y="60.0" font-size="16" fill="#deded8">Direct browser sign-in</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#access_token</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="185.0" font-size="16" fill="#deded8">Read token; remove fragment</text>
<text x="380.0" y="207.0" font-size="16" fill="#deded8">Check current terms / consent</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="317.0" font-size="16" fill="#deded8">Game-scoped APIs &amp; sockets</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">Explicitly accept terms when required</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">Untracked single-player play uses no account APIs or sockets.</text>
</g></svg>
