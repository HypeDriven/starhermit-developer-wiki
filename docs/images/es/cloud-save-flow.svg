<svg lang="es" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">Leer antes de escribir un guardado en la nube</title><desc id="description">Una lectura exitosa valida los datos y mantiene la ETag, o un 404 prepara los valores predeterminados. Lecturas fallidas y escrituras en bloque. Utilice escrituras condicionales; El éxito adopta el nuevo ETag, mientras que un conflicto 412 retiene el progreso local y requiere una recarga o una fusión explícita.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" x="380.0" y="55.0" font-size="16" fill="#deded8">Cargar ranura para guardar en la nube</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="172.0" font-size="16" fill="#deded8">Datos válidos o 404</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="194.0" font-size="16" fill="#deded8">Mantener ETag/valores predeterminados</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="172.0" font-size="16" fill="#deded8">Lectura fallida/no válida</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="194.0" font-size="16" fill="#deded8">Bloquear todas las cargas</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="302.0" font-size="16" fill="#deded8">Escritura condicional</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="324.0" font-size="16" fill="#deded8">Si coincide/Si no coincide</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="302.0" font-size="16" fill="#deded8">Guardado reconocido</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="324.0" font-size="16" fill="#deded8">Mantenga la nueva ETag</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="432.0" font-size="16" fill="#deded8">412 conflicto</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="454.0" font-size="16" fill="#deded8">Recargar/fusión explícita</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">Leer resultado</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">Éxito</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">Mantener el progreso local</text>
<text lengthAdjust="spacingAndGlyphs" textLength="236" x="630" y="278" font-size="13" fill="#bfc7c1">Vuelva a intentar la lectura antes de guardar.</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">Después de una escritura ambigua, vuelva a cargar antes de intentar otra escritura.</text>
</g></svg>
