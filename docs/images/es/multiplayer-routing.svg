<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="329.0" font-size="16" fill="#deded8">Guión/contenedor</text>
<text x="640.0" y="351.0" font-size="16" fill="#deded8">Valida el juego</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">HOST-RUTA · transportes de plataforma; el anfitrión simula</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">Las entradas van al anfitrión; las instantáneas regresan a los invitados.</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">SERVIDOR AUTORIZADO · la sala inicia una sesión separada</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">La sala se encarga del vestíbulo; gameSessionId identifica el juego.</text>
