<svg lang="es" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">Dos modelos de transporte multijugador.</title><desc id="description">En el juego enrutado por el anfitrión, los invitados envían entradas a través de enrutamiento en tiempo real a la simulación del anfitrión, y el anfitrión devuelve instantáneas. En el juego con autoridad de servidor, una sala inicia una sesión limitada; Los jugadores utilizan el zócalo del juego con un script o contenedor. La sala sigue siendo el vestíbulo.</desc>
