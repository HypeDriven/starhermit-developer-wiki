<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="104.0" font-size="16" fill="#deded8">Cliente anfitrión</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="126.0" font-size="16" fill="#deded8">Ejecuta simulación</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="120.0" y="329.0" font-size="16" fill="#deded8">Clientes de jugadores</text>
