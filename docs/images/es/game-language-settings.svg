<svg lang="es" xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title description">
<title id="title">El idioma es una sección en el menú de configuración del juego.</title>
<desc id="description">La navegación de configuración contiene gráficos, audio, controles e idioma. La sección Idioma seleccionado ofrece el idioma del juego, una opción de inglés con una bandera, detección automática del idioma del sistema y estado de guardado en la cuenta.</desc>
<rect width="760" height="420" rx="12" fill="#282a2b" />
<g font-family="system-ui, sans-serif" fill="#deded8">
<text x="380" y="44" text-anchor="middle" font-size="23">Configuraciones del juego</text>
<rect x="24" y="70" width="190" height="324" rx="10" fill="#202122" />
<g text-anchor="middle" font-size="17">
<text x="119" y="111">Gráficos</text><text x="119" y="157">Audio</text><text x="119" y="203">Controles</text>
<rect x="38" y="222" width="162" height="42" rx="7" fill="#343939" stroke="#a8cfbd" />
<text x="119" y="249" fill="#a8cfbd">Idioma</text>
</g>
<rect x="240" y="70" width="496" height="324" rx="10" fill="#202122" />
<g text-anchor="middle">
<text x="488" y="113" font-size="22">Idioma</text>
<text x="488" y="153" font-size="16">Idioma del juego</text>
<rect x="272" y="171" width="432" height="54" rx="7" fill="#343939" stroke="#687671" />
<g transform="translate(293 186) scale(.6)">
<path fill="#012169" d="M0 0h60v40H0z" /><path stroke="#fff" stroke-width="9" d="m0 0 60 40m0-40L0 40" />
<path stroke="#c8102e" stroke-width="3" d="m0 0 60 40m0-40L0 40" />
<path stroke="#fff" stroke-width="14" d="M30 0v40M0 20h60" /><path stroke="#c8102e" stroke-width="8" d="M30 0v40M0 20h60" />
</g>
<text x="488" y="205" font-size="17" translate="no">English</text>
<path d="m670 194 7 7 7-7" fill="none" stroke="#a8cfbd" stroke-width="2" />
<text x="488" y="262" font-size="15" fill="#a9ada9">También ofrecemos Automático (idioma del sistema)</text>
<text x="488" y="299" font-size="15" fill="#a9ada9"><tspan>Lenguaje efectivo: </tspan><tspan translate="no">English</tspan></text>
<rect x="272" y="326" width="432" height="42" rx="7" fill="#343939" />
