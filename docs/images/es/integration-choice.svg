<svg lang="es" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">Elige la autoridad del juego</title><desc id="description">El juego solo en navegador utiliza la lógica del juego local. El modo multijugador casual utiliza salas en tiempo real enrutadas por el anfitrión. Los resultados competitivos validados o el modo multijugador persistente utilizan un script o contenedor autorizado.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="59.0" font-size="16" fill="#deded8">¿Quién valida el juego?</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="207.0" font-size="16" fill="#deded8">Navegador para un jugador</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="229.0" font-size="16" fill="#deded8">Progreso propiedad del cliente</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="207.0" font-size="16" fill="#deded8">Multijugador informal</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="229.0" font-size="16" fill="#deded8">Salas enrutadas por el host</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="630.0" y="207.0" font-size="16" fill="#deded8">Clasificado / persistente</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">Guión o contenedor</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">juego local</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">Confía en el anfitrión</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">Validar en el servidor</text>
<text lengthAdjust="spacingAndGlyphs" textLength="736" x="380" y="302" font-size="13" fill="#bfc7c1">El inicio de sesión, la configuración y los guardados en la nube no requieren un servidor de juego.</text>
</g></svg>
