<svg lang="es" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">Un juego alojado recibe una credencial de alcance</title><desc id="description">El iniciador proporciona un token de juego o inicia sesión directamente en el navegador y recibe un token de acceso en el fragmento de URL. El juego elimina el fragmento, verifica los términos actuales y utiliza sus API específicas del juego. El juego para un jugador sin seguimiento omite las API de la cuenta.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="250" x="165.0" y="60.0" font-size="16" fill="#deded8">Lanzamiento desde StarHermit</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#token_juego</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="250" x="595.0" y="60.0" font-size="16" fill="#deded8">Inicio de sesión directo en el navegador</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#token_acceso</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="185.0" font-size="16" fill="#deded8">Leer ficha; eliminar fragmento</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="207.0" font-size="16" fill="#deded8">Verifique los términos/consentimiento actuales</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="317.0" font-size="16" fill="#deded8">API con ámbito de juego &amp; enchufes</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">Aceptar explícitamente los términos cuando sea necesario.</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">El juego para un jugador sin seguimiento no utiliza API ni sockets de cuenta.</text>
</g></svg>
