<svg lang="es" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">Publicar la carpeta del juego distribuible</title><desc id="description">Construya su fuente en una carpeta de cliente distribuible. Coloque starhermit.txt en su raíz. Cargue la carpeta o el paquete, o implemente el repositorio de GitHub configurado. Los jugadores reciben todo junto al manifiesto del cliente en el subdominio UUID del juego.</desc>
