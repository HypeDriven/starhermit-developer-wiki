<text x="380" y="45" font-size="13" fill="#bfc7c1">CONSTRUCCIÓN DEL CLIENTE → JUEGO PUBLICADO</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">Envíe únicamente los archivos que desea que reciban los jugadores.</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">Todos los archivos al lado del manifiesto del cliente se cargan y sirven.</text>
