<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt en la raíz</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="126.0" font-size="16" fill="#deded8">Publicar/implementar</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">Carpeta, paquete, GitHub</text>
