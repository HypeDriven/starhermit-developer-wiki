<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">Read before writing a cloud save</title><desc id="description">A successful read validates data and keeps the ETag, or a 404 prepares defaults. Failed reads block writes. Use conditional writes; success adopts the new ETag, while a 412 conflict retains local progress and requires reload or an explicit merge.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd"/></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b"/>
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135"/>
<path d="M380 107H630V135"/>
<path d="M130 214V265"/>
<path d="M235 307H305"/>
<path d="M130 344V437H305"/>
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671"/>
<text x="380.0" y="55.0" font-size="16" fill="#deded8">Load cloud-save slot</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671"/>
<text x="130.0" y="172.0" font-size="16" fill="#deded8">Valid data or 404</text>
<text x="130.0" y="194.0" font-size="16" fill="#deded8">Keep ETag / defaults</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671"/>
<text x="630.0" y="172.0" font-size="16" fill="#deded8">Failed / invalid read</text>
<text x="630.0" y="194.0" font-size="16" fill="#deded8">Block all uploads</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671"/>
<text x="130.0" y="302.0" font-size="16" fill="#deded8">Conditional write</text>
<text x="130.0" y="324.0" font-size="16" fill="#deded8">If-Match / If-None-Match</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671"/>
<text x="410.0" y="302.0" font-size="16" fill="#deded8">Acknowledged save</text>
<text x="410.0" y="324.0" font-size="16" fill="#deded8">Keep the new ETag</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671"/>
<text x="410.0" y="432.0" font-size="16" fill="#deded8">412 conflict</text>
<text x="410.0" y="454.0" font-size="16" fill="#deded8">Reload / explicit merge</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">Read outcome</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">Success</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">Keep local progress</text>
<text x="630" y="278" font-size="13" fill="#bfc7c1">Retry the read before saving</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">After an ambiguous write, reload before attempting another write.</text>
</g></svg>
