<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">An authoritative session's lifecycle</title>
  <desc id="description">A new session becomes active. Persistent sessions pause when nobody is connected and resume on reconnect. A result or abandonment ends an active session. An owner action, final member leave, or retention expiry can end a paused session.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465a7b"/></marker></defs>
  <rect width="760" height="260" rx="12" fill="#f5f8fc"/>
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#162746">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#dceafb" stroke="#465a7b"/>
    <text x="102" y="130">Active</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#fff0c9" stroke="#465a7b"/>
    <text x="377" y="130">Paused</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#e0e5eb" stroke="#465a7b"/>
    <text x="652" y="130">Finished</text>
    <g font-size="13"><text x="240" y="74">No players connected</text><text x="240" y="186">Reconnect and resume</text><text x="515" y="61">Owner ends / final</text><text x="515" y="79">member leaves / expiry</text><text x="377" y="228">Game result or abandonment</text></g>
  </g>
  <g stroke="#465a7b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300"/>
    <path d="M305 143H180"/>
    <path d="M450 105H575"/>
    <path d="M102 154V205H652V159"/>
  </g>
</svg>
