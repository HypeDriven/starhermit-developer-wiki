<svg lang="id" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">Dua model transportasi multipemain</title><desc id="description">Dalam permainan yang diarahkan ke host, tamu mengirimkan masukan melalui perutean waktu nyata ke simulasi host, dan host mengembalikan snapshot. Dalam permainan resmi server, sebuah ruangan memulai sesi terikat; pemain menggunakan soket permainan dengan skrip atau wadah. Ruangan itu tetap menjadi lobi.</desc>
