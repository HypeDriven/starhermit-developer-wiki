<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="329.0" font-size="16" fill="#deded8">Sesi terikat</text>
<text x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/games</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text x="640.0" y="329.0" font-size="16" fill="#deded8">Skrip / wadah</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" x="640.0" y="351.0" font-size="16" fill="#deded8">Memvalidasi gameplay</text>
<text x="380" y="34" font-size="13" fill="#bfc7c1">HOST-ROUTED · transportasi platform; simulasi tuan rumah</text>
<text x="380" y="195" font-size="13" fill="#bfc7c1">Masukan masuk ke host; snapshot kembali ke tamu.</text>
<text x="380" y="252" font-size="13" fill="#bfc7c1">SERVER-AUTHORITATIVE · ruangan memulai sesi terpisah</text>
<text x="380" y="425" font-size="13" fill="#bfc7c1">Ruangan itu menangani lobi; gameSessionId mengidentifikasi gameplay.</text>
