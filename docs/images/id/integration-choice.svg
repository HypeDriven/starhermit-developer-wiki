<svg lang="id" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">Pilih otoritas gameplay</title><desc id="description">Permainan khusus browser menggunakan logika permainan lokal. Multiplayer kasual menggunakan ruang real-time yang dirutekan host. Hasil kompetitif yang divalidasi atau multipemain persisten menggunakan skrip atau wadah resmi.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" x="380.0" y="59.0" font-size="16" fill="#deded8">Siapa yang memvalidasi gameplay?</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="130.0" y="207.0" font-size="16" fill="#deded8">Peramban pemain tunggal</text>
<text x="130.0" y="229.0" font-size="16" fill="#deded8">Kemajuan milik klien</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="207.0" font-size="16" fill="#deded8">Multipemain kasual</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" x="380.0" y="229.0" font-size="16" fill="#deded8">Kamar yang diarahkan oleh tuan rumah</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text x="630.0" y="207.0" font-size="16" fill="#deded8">Peringkat / gigih</text>
<text x="630.0" y="229.0" font-size="16" fill="#deded8">Skrip atau wadah</text>
<text x="130" y="143" font-size="13" fill="#bfc7c1">Permainan lokal</text>
<text x="380" y="143" font-size="13" fill="#bfc7c1">Percayai tuan rumah</text>
<text x="630" y="143" font-size="13" fill="#bfc7c1">Validasi di server</text>
<text x="380" y="302" font-size="13" fill="#bfc7c1">Masuk, pengaturan, dan penyimpanan cloud tidak memerlukan server gameplay.</text>
</g></svg>
