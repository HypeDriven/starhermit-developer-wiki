<svg lang="id" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">Game yang dihosting menerima kredensial terbatas</title><desc id="description">Peluncur menyediakan token permainan, atau mengarahkan permainan browser untuk masuk dan menerima token akses di fragmen URL. Game tersebut menghapus fragmen, memeriksa persyaratan saat ini, dan menggunakan API cakupan gamenya. Permainan pemain tunggal yang tidak terlacak melewati API akun.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="165.0" y="60.0" font-size="16" fill="#deded8">Peluncuran dari StarHermit</text>
<text x="165.0" y="82.0" font-size="16" fill="#deded8">#permainan_token</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="595.0" y="60.0" font-size="16" fill="#deded8">Masuk browser langsung</text>
<text x="595.0" y="82.0" font-size="16" fill="#deded8">#akses_token</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="185.0" font-size="16" fill="#deded8">Baca token; menghapus fragmen</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" x="380.0" y="207.0" font-size="16" fill="#deded8">Periksa ketentuan/persetujuan saat ini</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="317.0" font-size="16" fill="#deded8">API yang mencakup game &amp; soket</text>
<text x="380" y="258" font-size="13" fill="#bfc7c1">Terima persyaratan secara eksplisit bila diperlukan</text>
<text x="380" y="382" font-size="13" fill="#bfc7c1">Permainan pemain tunggal yang tidak terlacak tidak menggunakan API atau soket akun.</text>
</g></svg>
