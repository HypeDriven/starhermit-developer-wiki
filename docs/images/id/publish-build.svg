<svg lang="id" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">Publikasikan folder game yang dapat didistribusikan</title><desc id="description">Bangun sumber Anda ke dalam folder klien yang dapat didistribusikan. Letakkan starhermit.txt pada akarnya. Unggah folder atau bundel, atau sebarkan repositori GitHub yang dikonfigurasi. Pemain menerima semuanya di samping manifes klien di subdomain UUID game.</desc>
