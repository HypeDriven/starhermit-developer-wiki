<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text x="110.0" y="126.0" font-size="16" fill="#deded8">Proyek sumber</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="110.0" y="148.0" font-size="16" fill="#deded8">Bangun permainan Anda</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="126.0" font-size="16" fill="#deded8">Folder yang dapat didistribusikan</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt di root</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="126.0" font-size="16" fill="#deded8">Publikasikan / terapkan</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" x="650.0" y="148.0" font-size="16" fill="#deded8">Folder, bundel, GitHub</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="291.0" font-size="16" fill="#deded8">Permainan yang dihosting</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;siput&gt;.starhermit.com</text>
<text x="380" y="45" font-size="13" fill="#bfc7c1">PEMBANGUNAN KLIEN → GAME YANG DITERBITKAN</text>
<text x="380" y="218" font-size="13" fill="#bfc7c1">Hanya kirimkan file yang Anda ingin terima oleh pemain.</text>
<text x="380" y="365" font-size="13" fill="#bfc7c1">Setiap file di samping manifes klien diunggah dan disajikan.</text>
