<svg lang="id" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">Baca sebelum menulis penyimpanan cloud</title><desc id="description">Pembacaan yang berhasil memvalidasi data dan mempertahankan ETag, atau 404 menyiapkan default. Gagal membaca blok menulis. Gunakan penulisan bersyarat; kesuksesan mengadopsi ETag baru, sementara konflik 412 mempertahankan kemajuan lokal dan memerlukan pemuatan ulang atau penggabungan yang eksplisit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text x="380.0" y="55.0" font-size="16" fill="#deded8">Muat slot penyimpanan cloud</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="172.0" font-size="16" fill="#deded8">Data valid atau 404</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="194.0" font-size="16" fill="#deded8">Pertahankan ETag / default</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="172.0" font-size="16" fill="#deded8">Gagal/tidak valid dibaca</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="630.0" y="194.0" font-size="16" fill="#deded8">Blokir semua unggahan</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="130.0" y="302.0" font-size="16" fill="#deded8">Tulisan bersyarat</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" x="130.0" y="324.0" font-size="16" fill="#deded8">Jika-Cocok / Jika-Tidak Ada-Cocok</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="302.0" font-size="16" fill="#deded8">Diakui simpan</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="324.0" font-size="16" fill="#deded8">Pertahankan ETag baru</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text x="410.0" y="432.0" font-size="16" fill="#deded8">412 konflik</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" x="410.0" y="454.0" font-size="16" fill="#deded8">Muat ulang / penggabungan eksplisit</text>
<text x="380" y="101" font-size="13" fill="#bfc7c1">Baca hasilnya</text>
<text x="270" y="292" font-size="13" fill="#bfc7c1">Kesuksesan</text>
<text x="215" y="420" font-size="13" fill="#bfc7c1">Pertahankan kemajuan lokal</text>
<text lengthAdjust="spacingAndGlyphs" textLength="236" x="630" y="278" font-size="13" fill="#bfc7c1">Coba lagi baca sebelum menyimpan</text>
<text x="380" y="515" font-size="13" fill="#bfc7c1">Setelah penulisan yang ambigu, muat ulang sebelum mencoba penulisan lainnya.</text>
</g></svg>
