<svg lang="id" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">Siklus hidup sesi otoritatif</title>
  <desc id="description">Sesi baru menjadi aktif. Sesi persisten dijeda saat tidak ada orang yang tersambung dan dilanjutkan saat tersambung kembali. Hasil atau pengabaian mengakhiri sesi aktif. Tindakan pemilik, cuti anggota terakhir, atau habis masa berlaku retensi dapat mengakhiri sesi yang dijeda.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text x="102" y="130">Aktif</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text x="377" y="130">Dijeda</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text x="652" y="130">Selesai</text>
    <g font-size="13"><text x="240" y="74">Tidak ada pemain yang terhubung</text><text x="240" y="186">Hubungkan kembali dan lanjutkan</text><text x="515" y="61">Pemilik berakhir / final</text><text x="515" y="79">anggota keluar / kadaluarsa</text><text x="377" y="228">Hasil permainan atau pengabaian</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
