<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title description">
<title id="title">اقرأ قبل كتابة الحفظ السحابي</title><desc id="description">القراءة الناجحة تتحقق من صحة البيانات وتحتفظ بـ ETag، أو يقوم 404 بإعداد الإعدادات الافتراضية. فشل قراءة كتلة الكتابة. استخدام الكتابة الشرطية؛ يعتمد النجاح على ETag الجديد، بينما يحتفظ التعارض 412 بالتقدم المحلي ويتطلب إعادة التحميل أو الدمج الصريح.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="540" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 78V107H130V135" />
<path d="M380 107H630V135" />
<path d="M130 214V265" />
<path d="M235 307H305" />
<path d="M130 344V437H305" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="20" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="260" unicode-bidi="plaintext" direction="rtl" x="380.0" y="55.0" font-size="16" fill="#deded8">قم بتحميل فتحة الحفظ السحابي</text>
<rect x="25" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="130.0" y="172.0" font-size="16" fill="#deded8">بيانات صالحة أو 404</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="130.0" y="194.0" font-size="16" fill="#deded8">احتفظ بـ ETag / الإعدادات الافتراضية</text>
<rect x="525" y="140" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="630.0" y="172.0" font-size="16" fill="#deded8">قراءة فاشلة / غير صالحة</text>
<text unicode-bidi="plaintext" direction="rtl" x="630.0" y="194.0" font-size="16" fill="#deded8">منع كافة التحميلات</text>
<rect x="25" y="270" width="210" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="130.0" y="302.0" font-size="16" fill="#deded8">الكتابة المشروطة</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="130.0" y="324.0" font-size="16" fill="#deded8">إذا تطابق / إذا كان لا يوجد تطابق</text>
<rect x="310" y="270" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="410.0" y="302.0" font-size="16" fill="#deded8">حفظ معترف به</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" unicode-bidi="plaintext" direction="rtl" x="410.0" y="324.0" font-size="16" fill="#deded8">احتفظ بعلامة ETag الجديدة</text>
<rect x="310" y="400" width="200" height="74" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="410.0" y="432.0" font-size="16" fill="#deded8">412 الصراع</text>
<text lengthAdjust="spacingAndGlyphs" textLength="180" unicode-bidi="plaintext" direction="rtl" x="410.0" y="454.0" font-size="16" fill="#deded8">إعادة تحميل / دمج صريح</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="101" font-size="13" fill="#bfc7c1">قراءة النتيجة</text>
<text unicode-bidi="plaintext" direction="rtl" x="270" y="292" font-size="13" fill="#bfc7c1">نجاح</text>
<text unicode-bidi="plaintext" direction="rtl" x="215" y="420" font-size="13" fill="#bfc7c1">الحفاظ على التقدم المحلي</text>
<text unicode-bidi="plaintext" direction="rtl" x="630" y="278" font-size="13" fill="#bfc7c1">أعد محاولة القراءة قبل الحفظ</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="515" font-size="13" fill="#bfc7c1">بعد كتابة غامضة، أعد التحميل قبل محاولة كتابة أخرى.</text>
