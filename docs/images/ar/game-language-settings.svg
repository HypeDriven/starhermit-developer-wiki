<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title description">
<title id="title">اللغة هي قسم في قائمة إعدادات اللعبة</title>
<desc id="description">يحتوي التنقل في الإعدادات على الرسومات والصوت وعناصر التحكم واللغة. يقدم قسم اللغة المحدد لغة اللعبة، واختيار اللغة الإنجليزية مع علامة، والحساب التلقائي أو لغة النظام، وحالة الحفظ في الحساب.</desc>
