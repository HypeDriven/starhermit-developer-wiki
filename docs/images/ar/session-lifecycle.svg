<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title description">
  <title id="title">دورة حياة الجلسة الرسمية</title>
  <desc id="description">تصبح جلسة جديدة نشطة. تتوقف الجلسات المستمرة عند عدم اتصال أي شخص وتستأنف عند إعادة الاتصال. تؤدي النتيجة أو التخلي إلى إنهاء الجلسة النشطة. يمكن أن يؤدي إجراء المالك أو إجازة العضو النهائية أو انتهاء صلاحية الاحتفاظ إلى إنهاء الجلسة المتوقفة مؤقتًا.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
  <rect width="760" height="260" rx="12" fill="#282a2b" />
  <g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#deded8">
    <rect x="30" y="92" width="145" height="62" rx="12" fill="#343939" stroke="#a8cfbd" />
    <text unicode-bidi="plaintext" direction="rtl" x="102" y="130">نشيط</text>
    <rect x="305" y="92" width="145" height="62" rx="12" fill="#494337" stroke="#a8cfbd" />
    <text unicode-bidi="plaintext" direction="rtl" x="377" y="130">متوقف مؤقتًا</text>
    <rect x="580" y="92" width="145" height="62" rx="12" fill="#383b3c" stroke="#a8cfbd" />
    <text unicode-bidi="plaintext" direction="rtl" x="652" y="130">انتهى</text>
    <g font-size="13"><text unicode-bidi="plaintext" direction="rtl" x="240" y="74">لا يوجد لاعبين متصلين</text><text unicode-bidi="plaintext" direction="rtl" x="240" y="186">أعد الاتصال واستأنف</text><text unicode-bidi="plaintext" direction="rtl" x="515" y="61">ينتهي المالك / نهائي</text><text unicode-bidi="plaintext" direction="rtl" x="515" y="79">إجازات/انتهاء صلاحية العضو</text><text unicode-bidi="plaintext" direction="rtl" x="377" y="228">نتيجة المباراة أو التخلي عنها</text></g>
  </g>
  <g stroke="#a8cfbd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 105H300" />
    <path d="M305 143H180" />
    <path d="M450 105H575" />
    <path d="M102 154V205H652V159" />
  </g>
</svg>
