<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title description">
<title id="title">نشر مجلد اللعبة القابلة للتوزيع</title><desc id="description">قم ببناء المصدر الخاص بك في مجلد عميل قابل للتوزيع. ضع ملف starhermit.txt في جذره. قم بتحميل المجلد أو الحزمة، أو قم بنشر مستودع GitHub الذي تم تكوينه. يتلقى اللاعبون كل شيء بجوار بيان العميل في المجال الفرعي للعبة UUID.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="395" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M195 131H270" />
<path d="M485 131H560" />
<path d="M650 172V296H490" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="25" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="110.0" y="126.0" font-size="16" fill="#deded8">مشروع المصدر</text>
<text unicode-bidi="plaintext" direction="rtl" x="110.0" y="148.0" font-size="16" fill="#deded8">قم ببناء لعبتك</text>
<rect x="275" y="90" width="210" height="82" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="126.0" font-size="16" fill="#deded8">مجلد قابل للتوزيع</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="380.0" y="148.0" font-size="16" fill="#deded8">starhermit.txt في الجذر</text>
<rect x="565" y="90" width="170" height="82" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="650.0" y="126.0" font-size="16" fill="#deded8">نشر / نشر</text>
<text lengthAdjust="spacingAndGlyphs" textLength="150" unicode-bidi="plaintext" direction="rtl" x="650.0" y="148.0" font-size="16" fill="#deded8">مجلد، حزمة، جيثب</text>
<rect x="275" y="260" width="210" height="72" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="291.0" font-size="16" fill="#deded8">لعبة مستضافة</text>
<text lengthAdjust="spacingAndGlyphs" textLength="190" unicode-bidi="plaintext" direction="rtl" x="380.0" y="313.0" font-size="16" fill="#deded8">&lt;سبيكة&gt;.starhermit.com</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="45" font-size="13" fill="#bfc7c1">بناء العميل → اللعبة المنشورة</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="218" font-size="13" fill="#bfc7c1">قم فقط بشحن الملفات التي تنوي استلامها للاعبين.</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="365" font-size="13" fill="#bfc7c1">يتم تحميل كل ملف بجانب بيان العميل وتقديمه.</text>
</g></svg>
