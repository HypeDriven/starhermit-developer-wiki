<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">اختر سلطة اللعب</title><desc id="description">يستخدم اللعب في المتصفح فقط منطق اللعبة المحلي. يستخدم اللعب المتعدد غير الرسمي غرفًا حقيقية موجهة من قبل المضيف. تستخدم النتائج التنافسية التي تم التحقق منها أو اللعب المتعدد المستمر نصًا أو حاوية موثوقة.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="330" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M380 82V115H130V165" />
<path d="M380 82V165" />
<path d="M380 115H630V165" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="240" y="24" width="280" height="58" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="59.0" font-size="16" fill="#deded8">من يؤكد صحة اللعب؟</text>
<rect x="20" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="130.0" y="207.0" font-size="16" fill="#deded8">متصفح لاعب واحد</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" unicode-bidi="plaintext" direction="rtl" x="130.0" y="229.0" font-size="16" fill="#deded8">التقدم المملوك للعميل</text>
<rect x="270" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="207.0" font-size="16" fill="#deded8">متعددة عارضة</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" unicode-bidi="plaintext" direction="rtl" x="380.0" y="229.0" font-size="16" fill="#deded8">الغرف التي يوجهها المضيف</text>
<rect x="520" y="170" width="220" height="84" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="630.0" y="207.0" font-size="16" fill="#deded8">المرتبة / المستمرة</text>
<text lengthAdjust="spacingAndGlyphs" textLength="200" unicode-bidi="plaintext" direction="rtl" x="630.0" y="229.0" font-size="16" fill="#deded8">البرنامج النصي أو الحاوية</text>
<text unicode-bidi="plaintext" direction="rtl" x="130" y="143" font-size="13" fill="#bfc7c1">اللعب المحلي</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="143" font-size="13" fill="#bfc7c1">ثق بالمضيف</text>
<text unicode-bidi="plaintext" direction="rtl" x="630" y="143" font-size="13" fill="#bfc7c1">التحقق من صحة على الخادم</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="302" font-size="13" fill="#bfc7c1">لا يتطلب تسجيل الدخول والإعدادات والحفظ السحابي وجود خادم لعب.</text>
</g></svg>
