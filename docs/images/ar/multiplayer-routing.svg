<text unicode-bidi="plaintext" direction="rtl" x="120.0" y="104.0" font-size="16" fill="#deded8">العملاء الضيوف</text>
<text unicode-bidi="plaintext" direction="rtl" x="120.0" y="126.0" font-size="16" fill="#deded8">المدخلات / لقطات</text>
<rect x="290" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="380.0" y="104.0" font-size="16" fill="#deded8">التوجيه في الوقت الحقيقي</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="380.0" y="126.0" font-size="16" fill="#deded8">ws/v1/الوقت الحقيقي</text>
<rect x="550" y="70" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="640.0" y="104.0" font-size="16" fill="#deded8">العميل المضيف</text>
<text unicode-bidi="plaintext" direction="rtl" x="640.0" y="126.0" font-size="16" fill="#deded8">تشغيل المحاكاة</text>
<rect x="30" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="120.0" y="329.0" font-size="16" fill="#deded8">عملاء اللاعبين</text>
<text unicode-bidi="plaintext" direction="rtl" x="120.0" y="351.0" font-size="16" fill="#deded8">أوامر اللعب</text>
<rect x="290" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="329.0" font-size="16" fill="#deded8">جلسة ملزمة</text>
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="351.0" font-size="16" fill="#deded8">ws/v1/games</text>
<rect x="550" y="295" width="180" height="78" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="640.0" y="329.0" font-size="16" fill="#deded8">البرنامج النصي / الحاوية</text>
<text lengthAdjust="spacingAndGlyphs" textLength="160" unicode-bidi="plaintext" direction="rtl" x="640.0" y="351.0" font-size="16" fill="#deded8">التحقق من صحة اللعب</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="34" font-size="13" fill="#bfc7c1">توجيه المضيف · وسائل نقل المنصات؛ يحاكي المضيف</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="195" font-size="13" fill="#bfc7c1">تذهب المدخلات إلى المضيف؛ تعود اللقطات للضيوف.</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="252" font-size="13" fill="#bfc7c1">مخول الخادم · تبدأ الغرفة جلسة منفصلة</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="425" font-size="13" fill="#bfc7c1">الغرفة تتعامل مع الردهة. يحدد gameSessionId أسلوب اللعب.</text>
