<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title description">
<title id="title">نموذجان للنقل متعددي اللاعبين</title><desc id="description">في اللعب الذي يوجهه المضيف، يرسل الضيوف المدخلات من خلال التوجيه في الوقت الفعلي إلى محاكاة المضيف، ويعيد المضيف اللقطات. في اللعب المخول للخادم، تبدأ الغرفة جلسة مقيدة؛ يستخدم اللاعبون مقبس الألعاب مع برنامج نصي أو حاوية. تظل الغرفة هي الردهة.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
