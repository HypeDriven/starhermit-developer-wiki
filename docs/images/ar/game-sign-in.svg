<svg lang="ar" xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title description">
<title id="title">تتلقى اللعبة المستضافة بيانات اعتماد محددة النطاق</title><desc id="description">يوفر المشغل رمزًا مميزًا للعبة، أو يقوم بتشغيل المتصفح المباشر بتسجيل الدخول ويتلقى رمز وصول في جزء عنوان URL. تقوم اللعبة بإزالة الجزء والتحقق من المصطلحات الحالية واستخدام واجهات برمجة التطبيقات الخاصة بنطاق اللعبة. يتخطى اللعب الفردي الذي لم يتم تعقبه واجهات برمجة تطبيقات الحساب.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a8cfbd" /></marker></defs>
<rect width="760" height="405" rx="12" fill="#282a2b" />
<g fill="none" stroke="#a8cfbd" stroke-width="2" marker-end="url(#arrow)">
<path d="M165 100V130H380V150" />
<path d="M595 100V130H380" />
<path d="M380 225V275" />
</g><g font-family="system-ui, sans-serif" text-anchor="middle">
<rect x="30" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="165.0" y="60.0" font-size="16" fill="#deded8">إطلاق من ستارهيرميت</text>
<text unicode-bidi="plaintext" direction="rtl" x="165.0" y="82.0" font-size="16" fill="#deded8">#game_token</text>
<rect x="460" y="30" width="270" height="70" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="250" unicode-bidi="plaintext" direction="rtl" x="595.0" y="60.0" font-size="16" fill="#deded8">تسجيل الدخول المباشر للمتصفح</text>
<text unicode-bidi="plaintext" direction="rtl" x="595.0" y="82.0" font-size="16" fill="#deded8">#access_token</text>
<rect x="220" y="155" width="320" height="70" rx="10" fill="#343939" stroke="#687671" />
<text unicode-bidi="plaintext" direction="rtl" x="380.0" y="185.0" font-size="16" fill="#deded8">قراءة الرمز؛ إزالة جزء</text>
<text lengthAdjust="spacingAndGlyphs" textLength="300" unicode-bidi="plaintext" direction="rtl" x="380.0" y="207.0" font-size="16" fill="#deded8">تحقق من الشروط / الموافقة الحالية</text>
<rect x="220" y="280" width="320" height="62" rx="10" fill="#343939" stroke="#687671" />
<text lengthAdjust="spacingAndGlyphs" textLength="300" unicode-bidi="plaintext" direction="rtl" x="380.0" y="317.0" font-size="16" fill="#deded8">واجهات برمجة التطبيقات على نطاق اللعبة &amp; مآخذ</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="258" font-size="13" fill="#bfc7c1">قبول الشروط بشكل صريح عند الحاجة</text>
<text unicode-bidi="plaintext" direction="rtl" x="380" y="382" font-size="13" fill="#bfc7c1">لا يستخدم اللعب الفردي الذي لم يتم تعقبه واجهات برمجة تطبيقات أو مآخذ توصيل للحساب.</text>
</g></svg>
