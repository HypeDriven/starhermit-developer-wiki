title: StarHermit Developer Wiki
description: Build, connect, and publish games with StarHermit.
url: https://wiki.starhermit.com
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-readme-index
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: wiki
      lang: en
exclude:
  - CLAUDE.md
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - tests
